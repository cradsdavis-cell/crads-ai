$('ratesX').addEventListener('click', () => openRates(false));

seq = 10;
loadRates();
drawRates();
render();
fitView();

/* =========================== REAL MODE (2026-08-03) ========================
   ?real=1 replaces the example world with THIS box's own network, read from
   /topology/world, and freezes every verb. Same page, same renderer, same
   model: the member gets the thing we actually built, showing their network
   instead of Acme CoLab's.

   Frozen rather than hidden. The verbs stay visible because they are how this
   page explains what CAN happen to a box, and the app-link layer already says
   where each one happens for real. What they must not do is imply that
   clicking here changed anything: the world on screen is a reading of a real
   box, and this page has no authority over it. */
function frozen(){
  if (!REAL) return false;
  const b = $('freezeNote');
  if (b) { b.dataset.show = '1'; clearTimeout(frozen._t); frozen._t = setTimeout(() => { b.dataset.show = ''; }, 4000); }
  return true;
}
if (REAL) {
  let lastWorld = '';
  /* every entry point that mutates the world. Kept as an explicit list rather
     than a flag inside render(), so a NEW mutator added later fails loudly in
     review instead of silently becoming writable in real mode. */
  const freeze = (name) => { const f = window[name]; if (typeof f === 'function') window[name] = function(){ if (frozen()) return; return f.apply(this, arguments); }; };
  ['runVerb', 'sendReq', 'arrive', 'stamp', 'destroyBox'].forEach(freeze);

  const worldNote = (msg) => { const s = $('realNote'); if (s) s.textContent = msg; };
  fetch('/topology/world', { method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ host: new URLSearchParams(location.search).get('host') || '' }) })
    .then(r => r.json())
    .then(w => {
      if (!w || !w.ok) { worldNote(w && w.reason ? w.reason : 'Your mineral could not be read, so this is not your network.'); return; }
      const built = [];
      /* the rock exists only if the box named one: see worldFacts in
         panel-server.mjs for why managed_by must never decide this */
      if (w.org) built.push(mk('org', null, w.org.label, { pebbles: true, framework: w.box.framework || '' }));
      built.push(mk('you', w.org ? 'org' : null, w.box.label, {
        pebbles: w.box.tier === 'rock',
        owner: w.box.ownedByOrg && w.org ? 'org' : 'self',
        runs: w.box.runs,
        origin: w.box.origin,
        grafts: w.box.grafts || [],
      }));
      nodes = built;
      preset = 'real';
      actingAs = 'you'; sel = 'you'; requests = []; reqSeq = 0; seq = 100; lastChange = null;
      undoStack.length = 0; redoStack.length = 0;   /* nothing before a reading to undo TO */
      worldNote(w.devices.length
        ? `Your network, read from your mineral. ${w.devices.length} computer${w.devices.length === 1 ? '' : 's'} can open it${w.support.active ? ', and a Crads AI support window is open' : ''}.`
        : 'Your network, read from your mineral.');
      lastWorld = JSON.stringify([w.org, w.box, w.devices, w.support]);
      render(); fitView();
    })
    .catch(() => worldNote('Your mineral could not be reached, so this is not your network.'));

  /* Live, not a snapshot (Sam, 2026-08-03: "just a visual, which should change
     in real time"). Re-read the box on a slow heartbeat and redraw ONLY when
     the world actually changed: render() on identical facts would still cost a
     layout, and fitView() would yank the member's pan/zoom for nothing. The
     view is refit only when the SHAPE changed (a node appeared or went), not
     when a fact on an existing node moved. */
  const readWorld = () => fetch('/topology/world', { method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ host: new URLSearchParams(location.search).get('host') || '' }) })
    .then(r => r.json());
  setInterval(() => {
    readWorld().then(w => {
      if (!w || !w.ok) return;   /* a blip never blanks a drawn map */
      const sig = JSON.stringify([w.org, w.box, w.devices, w.support]);
      if (sig === lastWorld) return;
      lastWorld = sig;
      const before = nodes.map(n => n.id).join(',');
      const built = [];
      if (w.org) built.push(mk('org', null, w.org.label, { pebbles: true, framework: w.box.framework || '' }));
      built.push(mk('you', w.org ? 'org' : null, w.box.label, {
        pebbles: w.box.tier === 'rock',
        owner: w.box.ownedByOrg && w.org ? 'org' : 'self',
        runs: w.box.runs, origin: w.box.origin, grafts: w.box.grafts || [],
      }));
      nodes = built;
      if (!nodes.some(n => n.id === sel)) sel = 'you';
      if (!nodes.some(n => n.id === actingAs)) actingAs = 'you';
      worldNote(w.devices.length
        ? `Your network, read from your mineral. ${w.devices.length} computer${w.devices.length === 1 ? '' : 's'} can open it${w.support.active ? ', and a Crads AI support window is open' : ''}.`
        : 'Your network, read from your mineral.');
      render();
      if (nodes.map(n => n.id).join(',') !== before) fitView();
    }).catch(() => {});
  }, 20000);
}
</script>

<!-- ======================= APP-LINK LAYER (product copy only) =======================
     Not in the mockup. The sandbox above simulates every verb on the model; this
     layer adds "do it for real" links next to the verbs that have a REAL surface
     in the app face this page was served from. The server stamps the edition into
     the placeholder below; opened as a bare file (or with the placeholder
     unreplaced) nothing decorates and the sandbox is untouched.
     HONESTY RULE for the map: a row exists only for a verb whose target section
     verifiably exists in that edition's app today. A verb with no real surface
     gets no link, matching the sandbox's unbuilt-flag discipline. -->
<style>
.applink{font-size:10.5px; color:var(--accent, #5457D6); text-decoration:none;
  margin-left:2px; padding:2px 5px; border:1px solid currentColor; border-radius:6px;
  opacity:.75; white-space:nowrap; vertical-align:middle}
.applink:hover{opacity:1; text-decoration:none}
/* read-only in the app (Sam's ruling 2026-08-03): simulated verbs go inert */
.model-only{opacity:.45 !important; cursor:default !important}
.ro-chip{font-size:10px; letter-spacing:.05em; text-transform:uppercase;
  color:var(--faint, #8792A2); border:1px solid var(--line2, #D6DEE8);
  border-radius:6px; padding:2px 7px; margin-left:6px; white-space:nowrap}
</style>
<script>
(() => {
  const EDITION = '__AIOS_EDITION__';
  if (EDITION !== 'org' && EDITION !== 'member') return;
  /* selector -> per-edition [href, tooltip]. Decorated inside the inspector after
     each of its renders. `once` collapses repeated matches (request cards) to one
     link on the first match. */
  const LINKS = [
    /* verified 2026-08-03 audit: every row names a surface that exists and
       ACTS in that edition's app. Org-only rows are deliberate (Sam's ruling):
       a member seeing Pause/Leave/Rejoin gets no chip, because their app has
       no way to run them today. */
    { match: '[data-dial="owner"]',
      org:    ['/panel.html#pebbles', 'For real: ownership transfers run on the Members cards'],
      member: ['/panel.html#dashboard', 'For real: accept a staged rock transfer on your dashboard'] },
    { match: '[data-dial="home"]',
      org:    ['/panel.html#rocks', 'For real: send a re-anchor ask from the Organisations tab'] },
    { match: '[data-seat-verb="support"]',
      member: ['/panel.html#sharing', 'For real: grant or revoke support access under Sharing'] },
    { match: '[data-seat-destroy]',
      org:    ['/panel.html#yourrock', 'For real: tear a member mineral down under Your rock'] },
    { match: '[data-seat-verb="status"]', once: true,
      org:    ['/panel.html#pebbles', 'For real: Pause, Resume and Leave live on the Members cards'] },
    { match: '[data-seat-verb="hpause"]',
      org:    ['/panel.html#pebbles', 'For real: Pause delivery sits on the member card under Members'] },
    { match: '[data-menu="joinSeat"]',
      org:    ['/panel.html#rocks', 'For real: send a late-attach ask from the Organisations tab'],
      member: ['/door', 'For real: join a rock from the start screen'] },
    { match: '[data-req-send="rejoin"]',
      org:    ['/panel.html#rocks', 'For real: send an invite-back (rejoin) from the Organisations tab'] },
    { match: '[data-req-send="graft"]',
      org:    ['/panel.html#rocks', 'For real: offer your framework (reframe) from the Organisations tab'] },
    { match: '#newBtn',
      org:    ['/panel.html#decisions', 'For real: stamp a pebble or invite a member under Decisions'] },
    { match: '.rename2',
      member: ['/console', 'For real: rename your mineral from your console'] },
    { match: '[data-req-answer]', once: true,
      org:    ['/panel.html#rocks', 'For real: requests wait on the Organisations tab'],
      member: ['/console', 'For real: your console shows what is waiting on you'] },
  ];
  /* READ-ONLY IN THE APP (Sam's ruling 2026-08-03): the network view must not
     pretend to act. Every simulated box verb goes inert; what stays live is
     READING (seat switch, layers, examples, zoom, find) and the ↗ links,
     which are the actual real actions. The bare file (mockup) keeps full
     simulation: this block only runs under a served edition. */
  const RO_BLOCK = '[data-seat-verb],[data-dial],[data-menu],[data-req-send],[data-req-answer],[data-seat-destroy],#newBtn,.who-edit';
  const inert = (root) => {
    root.querySelectorAll(RO_BLOCK).forEach((el) => {
      if (el.classList.contains('model-only')) return;
      el.classList.add('model-only');
      if ('disabled' in el) el.disabled = true;
      if (el.tagName === 'INPUT') el.readOnly = true;
      if (!el.title) el.title = 'model only here: the real action is the link beside it';
    });
  };
  const decorate = (root) => {
    inert(root);
    for (const row of LINKS){
      const to = row[EDITION];
      if (!to) continue;
      const hits = root.querySelectorAll(row.match);
      for (let i = 0; i < hits.length; i++){
        if (row.once && i > 0) break;
        const el = hits[i];
        if (el.nextElementSibling && el.nextElementSibling.classList
          && el.nextElementSibling.classList.contains('applink')) continue;
        const a = document.createElement('a');
        a.className = 'applink'; a.href = to[0]; a.title = to[1];
        a.textContent = 'in app ↗';
        /* Framed in the app (the read-only Network tab), a new browser tab is
           the wrong door: the real surface lives in the window this frame is
           already inside. Ask the rock to go there. Everywhere else this
           stays a plain link that keeps the sandbox world intact. */
        if (REAL && window.rock !== window){
          a.href = 'javascript:void 0';
          a.addEventListener('click', (ev) => {
            ev.preventDefault();
            try { window.rock.postMessage({ type: 'crads-app-nav', href: to[0] }, location.origin); } catch (e) {}
          });
        } else { a.target = '_blank'; a.rel = 'noopener'; }
        el.insertAdjacentElement('afterend', a);
      }
    }
  };
  const insp = document.getElementById('inspector');
  if (!insp) return;
  /* the inspector redraws by innerHTML on every model change; re-decorate after
     each. Inserting links re-fires the observer: the already-decorated guard
     above makes that second pass a no-op, so there is no loop. */
  new MutationObserver(() => decorate(insp)).observe(insp, { childList: true, subtree: true });
  /* one whole-page pass at boot picks up the static toolbar (#newBtn); the
     observer owns the inspector from here on */
  decorate(document.body);
  /* say why the buttons are quiet, once, in the toolbar */
  const seatBtn = document.getElementById('seatBtn');
  if (seatBtn) seatBtn.insertAdjacentHTML('afterend',
    '<span class="ro-chip" title="This page shows the model. Buttons that would pretend to act are switched off; the small links act for real in your app.">view only · links act</span>');
})();
</script>
