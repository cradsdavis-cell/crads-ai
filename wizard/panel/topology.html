<meta charset="utf-8">
<title>Crads AI Topology</title>
<!-- Product copy of the model's reference implementation
     (docs/superpowers/ui-overhaul/mockups/topology-sandbox.html on feat/ui-overhaul).
     TWO intended divergences, nothing else: the query-string boot block at
     "Served in the app at /topology", and the APP-LINK LAYER appended at the very
     end of the file. Keep the two files in step: a model change lands in the
     mockup first, then is re-copied here with both divergences preserved. -->


<style>
/* ============================================================================
   CRADS AI TOPOLOGY - the box-network console, seats only.
   There is no god view: you are always somebody. Crads AI is the landing
   seat: it sees almost everything and can do almost nothing. Every mineral is a
   seat with three dials (Ownership / Management / Hosting), a short row of
   verbs, and an inbox: anything needing another party's yes is a request
   answered from their seat.
   Light platform register: white chrome on cool paper, colour only where it
   means something: green = the member/self, amber = an owning/managing rock,
   violet = the platform, indigo = the product's own voice.
   ========================================================================== */
:root{
  --bg:#F6F8FB; --bg2:#FFFFFF; --canvas:#F7F9FC;
  --panel:#FFFFFF; --panel2:#F6F8FB;
  --line:#E9EDF3; --line2:#D6DEE8;
  --ink:#1A1F36; --soft:#4F566B; --faint:#8792A2;
  --accent:#5457D6;
  --self:#0E9F6E; --rock:#C2700D; --plat:#7C5CE0;
  --bad:#DF3B57; --warn:#B7791F; --good:#0E9F6E;
  --shadow-s:0 1px 2px rgba(26,31,54,.05), 0 1px 6px rgba(26,31,54,.05);
  --shadow-m:0 1px 2px rgba(26,31,54,.06), 0 6px 18px rgba(26,31,54,.09);
  --shadow-l:0 2px 6px rgba(26,31,54,.08), 0 14px 40px rgba(26,31,54,.14);
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Code",Menlo,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--ui);
  font-size:13px; line-height:1.5; -webkit-font-smoothing:antialiased; overflow:hidden}

/* ---------------------------------------------------------------- shell --- */
.app{display:grid; height:100vh;
  grid-template-columns:58px 1fr 348px;
  grid-template-rows:54px 1fr;
  grid-template-areas:"top top top" "rail canvas insp"}
@media (max-width:980px){
  body{overflow:auto}
  .app{display:block; height:auto}
  .rail{display:flex !important; flex-direction:row !important; width:auto !important;
    height:auto !important; border-right:none !important; border-bottom:1px solid var(--line)}
  .canvas-vp{height:60vh}
  .insp{width:auto !important; max-height:none !important; border-left:none !important;
    border-top:1px solid var(--line)}
}

/* ---------------------------------------------------------------- topbar --- */
.top{grid-area:top; display:flex; align-items:center; gap:10px; padding:0 16px;
  background:var(--panel); border-bottom:1px solid var(--line); z-index:30}
.brand{display:flex; align-items:center; gap:9px; margin-right:8px; white-space:nowrap}
.brand .mark{width:11px; height:11px; border-radius:3px; background:var(--accent);
  box-shadow:0 1px 4px rgba(84,87,214,.4)}
.brand .nm1{font-size:13.5px; font-weight:650; letter-spacing:-.01em; color:var(--ink)}
.brand .nm2{font-size:13.5px; font-weight:500; color:var(--faint)}
.tdiv{width:1px; height:20px; background:var(--line); flex:none}
/* real mode (?real=1). Empty in the sandbox, so neither takes space there. */
.realnote{font-family:var(--ui); font-size:12px; color:var(--soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:38ch}
.realnote:empty{display:none}
/* display, not opacity: at opacity 0 it still held toolbar width in the sandbox,
   where real mode never runs and the note has nothing to say */
.freezenote{display:none; font-family:var(--ui); font-size:12px; color:var(--accent); white-space:nowrap; pointer-events:none}
.freezenote[data-show="1"]{display:inline}
.tgrow{flex:1}
button.tb, .tb{font-family:var(--ui); font-size:12px; font-weight:500;
  background:var(--panel); color:var(--soft);
  border:1px solid var(--line2); border-radius:8px; padding:6px 12px; cursor:pointer;
  transition:color 120ms, border-color 120ms, box-shadow 120ms; white-space:nowrap}
button.tb:hover:not(:disabled){color:var(--ink); border-color:#B9C4D4; box-shadow:var(--shadow-s)}
button.tb:disabled{opacity:.4; cursor:not-allowed}
button.tb[aria-pressed="true"]{color:var(--accent); border-color:var(--accent); background:#F3F4FE}
button.tb:focus-visible{outline:none; box-shadow:0 0 0 3px rgba(84,87,214,.28)}
button.tb .cara{color:var(--faint); margin-left:5px; font-size:10px}
.pill{display:inline-flex; align-items:center; gap:7px; font-family:var(--ui);
  font-size:12px; font-weight:500; color:var(--soft);
  border:1px solid var(--line2); border-radius:99px; padding:5px 13px; cursor:pointer;
  background:var(--panel); transition:border-color 120ms, box-shadow 120ms}
.pill:hover{border-color:#B9C4D4; box-shadow:var(--shadow-s)}
.pill .dotp{width:8px; height:8px; border-radius:50%; background:var(--good)}
.pill[data-worst="blocked"] .dotp{background:var(--bad)}
.pill[data-worst="false"] .dotp{background:var(--warn)}
.pill[data-worst="dead"] .dotp, .pill[data-worst="unbuilt"] .dotp{background:var(--plat)}
.kbd{font-family:var(--mono); font-size:9.5px; color:var(--faint);
  border:1px solid var(--line2); border-radius:4px; padding:1px 5px; background:var(--panel2)}
.inb{display:inline-block; min-width:15px; border-radius:8px; background:var(--accent);
  color:#fff; font-size:9.5px; font-weight:650; text-align:center; padding:0 4px}

/* ---------------------------------------------------------------- rail --- */
.rail{grid-area:rail; display:flex; flex-direction:column; align-items:center; gap:5px;
  padding:12px 0; background:var(--panel); border-right:1px solid var(--line); z-index:20}
.rv{width:46px; padding:8px 0 6px; display:flex; flex-direction:column; align-items:center;
  gap:4px; background:transparent; border:1px solid transparent; border-radius:9px;
  color:var(--faint); cursor:pointer; transition:color 120ms, background 120ms}
.rv svg{width:17px; height:17px; display:block}
.rv span{font-family:var(--ui); font-size:8.5px; font-weight:600; letter-spacing:.04em;
  text-transform:uppercase}
.rv:hover{color:var(--soft); background:var(--panel2)}
.rv[aria-pressed="true"]{color:var(--accent); background:#F3F4FE}
.rv:focus-visible{outline:none; box-shadow:0 0 0 3px rgba(84,87,214,.28)}
.rgrow{flex:1}

/* ---------------------------------------------------------------- canvas --- */
.canvas-vp{grid-area:canvas; position:relative; overflow:hidden; background:var(--canvas);
  background-image:radial-gradient(#DFE6EF 1px, transparent 1px);
  background-size:24px 24px; cursor:grab}
.canvas-vp.panning{cursor:grabbing}
.world{position:absolute; left:0; top:0; transform-origin:0 0; width:max-content}
.world svg.tree{position:absolute; inset:0; pointer-events:none; overflow:visible}

.bx{position:absolute; width:212px; padding:0; cursor:pointer; text-align:left;
  background:var(--panel); border:1px solid var(--line2); border-radius:11px;
  font-family:var(--ui); color:var(--ink); box-shadow:var(--shadow-m);
  transition:border-color 130ms, box-shadow 130ms}
.bx:hover{border-color:#B9C4D4}
.bx:focus-visible{outline:none; border-color:var(--accent)}
.bx[data-sel="1"]{border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(84,87,214,.22), var(--shadow-m)}
.bx[data-me="1"]{border-color:var(--self)}
.bx[data-me="1"][data-sel="1"]{box-shadow:0 0 0 3px rgba(14,159,110,.25), var(--shadow-m)}
.bx[data-status="paused"]{border-style:dashed}
.bx[data-status="left"]{border-style:dashed; opacity:.5; box-shadow:none}
.bx[data-kind="pebble"]{border-radius:20px}
.bx .hd{display:flex; align-items:center; gap:6px; padding:9px 13px 0}
.bx .kind{flex:none; font-size:9px; font-weight:650; letter-spacing:.05em;
  text-transform:uppercase; border-radius:5px; padding:2px 7px;
  color:#6B7280; background:var(--panel2)}
.bx[data-kind="rock"] .kind{color:#A05E0B; background:#FBF1E2}
.bx .rel{margin-left:auto; flex:none; font-size:8.5px; font-weight:650;
  letter-spacing:.05em; text-transform:uppercase; color:#fff;
  background:var(--accent); border-radius:5px; padding:2px 7px}
.bx[data-me="1"] .rel{background:var(--self)}
.bx .rq{position:absolute; top:-8px; left:-8px; min-width:17px; height:17px; border-radius:9px;
  background:var(--accent); color:#fff; font-size:9.5px; font-weight:650; line-height:17px;
  text-align:center; padding:0 4px; border:2.5px solid var(--canvas); box-shadow:var(--shadow-s)}
.bx .dot{position:absolute; top:-5px; right:-5px; width:12px; height:12px; border-radius:50%;
  border:2.5px solid var(--canvas); box-shadow:var(--shadow-s)}
.bx .dot[data-sev="blocked"]{background:var(--bad)}
.bx .dot[data-sev="false"]{background:var(--warn)}
.bx .dot[data-sev="dead"]{background:var(--faint)}
.bx .dot[data-sev="unbuilt"]{background:var(--plat)}
.bx .bd{display:block; padding:4px 13px 11px}
.bx .nm{font-size:14.5px; font-weight:650; display:block; letter-spacing:-.012em;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.bx .meta{font-size:11px; color:var(--faint); display:block; margin-top:3px; line-height:1.45}
.bx .meta .val{font-weight:600}
.bx .meta .val[data-v="self"]{color:var(--self)}
.bx .meta .val[data-v="rock"]{color:var(--rock)}
.bx .meta .val[data-v="crads"]{color:var(--plat)}
.bx .netb{display:block; margin-top:4px; padding-top:4px; border-top:1px dashed var(--line);
  font-size:11px; font-weight:650; font-variant-numeric:tabular-nums}
.bx .netb[data-t="pos"]{color:var(--good)}
.bx .netb[data-t="neg"]{color:var(--bad)}
.bx .netb[data-t="cost"]{color:var(--faint); font-weight:600}
/* the grow strip: a sibling of the card, never a pebble (cards are <button>s) */
.simc{position:absolute; width:212px; z-index:2; display:flex; align-items:center; gap:7px;
  padding:4px 11px; box-sizing:border-box; background:rgba(255,255,255,.94);
  border:1px solid var(--line); border-radius:9px; font-size:9.5px; font-weight:650;
  letter-spacing:.04em; text-transform:uppercase; color:var(--faint);
  box-shadow:0 1px 4px rgba(15,23,42,.07)}
.simc input[type="range"]{flex:1; height:14px; margin:0; accent-color:var(--rock);
  cursor:ew-resize}
.simc b{min-width:20px; text-align:right; font-size:11px; color:var(--soft);
  font-variant-numeric:tabular-nums}
.bx .xtra{display:block; font-size:10.5px; color:var(--soft);
  margin-top:7px; padding-top:7px; border-top:1px solid var(--line);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.bx.crads{border-color:#DCD2F6; background:linear-gradient(180deg,#FBFAFF,#F6F3FE)}
.bx.crads[data-sel="1"]{border-color:var(--plat);
  box-shadow:0 0 0 3px rgba(124,92,224,.2), var(--shadow-m)}
.bx.crads[data-me="1"]{border-color:var(--plat)}
.bx.crads .nm{color:var(--plat)}

/* ---- HUD ---- */
.hud-bl{position:absolute; left:16px; bottom:16px; display:flex; flex-direction:column;
  gap:6px; align-items:flex-start; z-index:5; pointer-events:none}
.chip{font-size:11px; color:var(--soft); background:rgba(255,255,255,.9);
  backdrop-filter:blur(8px); border:1px solid var(--line); border-radius:8px;
  padding:6px 11px; max-width:62ch; box-shadow:var(--shadow-s)}
.zoomer{position:absolute; right:16px; bottom:16px; display:flex; gap:6px; z-index:5}
.zoomer .tb{background:rgba(255,255,255,.92); backdrop-filter:blur(8px)}

/* ---------------------------------------------------------------- inspector --- */
.insp{grid-area:insp; background:var(--panel); border-left:1px solid var(--line);
  overflow-y:auto; padding:18px 18px 28px; z-index:10}
.insp h2{font-size:10.5px; font-weight:650; letter-spacing:.08em; text-transform:uppercase;
  color:var(--faint); margin:0 0 6px}
.insp .sect{font-size:10.5px; font-weight:650; letter-spacing:.08em; text-transform:uppercase;
  color:var(--faint); margin:20px 0 9px; padding-top:16px; border-top:1px solid var(--line)}
.who-edit{font-family:var(--ui); font-size:17px; font-weight:650; letter-spacing:-.014em;
  color:var(--ink); background:transparent; border:none; border-bottom:1.5px dashed transparent;
  padding:0 0 3px; margin:3px 0 8px; width:100%; outline:none}
.who-edit:hover{border-bottom-color:var(--line2)}
.who-edit:focus{border-bottom-color:var(--accent)}
.idrow{display:flex; gap:5px; align-items:center; flex-wrap:wrap; margin-bottom:2px}
.tagc{font-size:9px; font-weight:650; letter-spacing:.05em; text-transform:uppercase;
  border-radius:5px; padding:2px 8px; color:#6B7280; background:var(--panel2)}
.tagc[data-t="rock"]{color:#A05E0B; background:#FBF1E2}
.tagc[data-t="paused"]{color:var(--warn); background:#FBF4E4}
.tagc[data-t="left"]{color:var(--bad); background:#FDF0F2}
.tagc[data-t="active"]{color:var(--good); background:#E9F8F1}
.tagc[data-t="you"]{color:#fff; background:var(--self)}
.tagc[data-t="plat"]{color:var(--plat); background:#F0EAFC}
/* the three dials */
.dial{display:grid; grid-template-columns:88px 1fr max-content; gap:10px; align-items:center;
  padding:9px 0; border-top:1px solid var(--line)}
.dial:first-pebble{border-top:none}
.dial label{font-size:10px; font-weight:600; letter-spacing:.05em;
  text-transform:uppercase; color:var(--faint)}
.dial .dv{font-size:12.5px; color:var(--ink); font-weight:600; overflow-wrap:anywhere}
.dial .dv small{display:block; font-size:10.5px; color:var(--faint); font-weight:400}
.dial .dv .c-self{color:var(--self)} .dial .dv .c-rock{color:var(--rock)}
.dial .dv .c-plat{color:var(--plat)}
.frow{display:grid; grid-template-columns:88px 1fr; gap:10px; padding:6px 0;
  border-top:1px solid var(--line); align-items:baseline}
.frow:first-pebble{border-top:none}
.frow label{font-size:10px; font-weight:600; letter-spacing:.05em;
  text-transform:uppercase; color:var(--faint)}
.frow .fv{font-size:12px; color:var(--soft); line-height:1.5; overflow-wrap:anywhere}
.frow .fv b{color:var(--ink); font-weight:650}
.ledrows{display:grid; gap:4px}
.ledr{font-size:11.5px; line-height:1.5; color:var(--soft); font-variant-numeric:tabular-nums}
.ledr[data-k="model"]{color:var(--warn)}
.ledr[data-k="licence"], .ledr[data-k="hosted"], .ledr[data-k="plat"]{color:var(--plat)}
.ledr[data-k="membership"], .ledr[data-k="in"]{color:var(--self)}
.ledr[data-k="none"], .ledr[data-k="seat"]{color:var(--faint)}
.ledr[data-k="net"]{color:var(--good); font-weight:600}
.ledr[data-k="neg"]{color:var(--bad); font-weight:600}
.ledr[data-k="cost"]{color:var(--soft); font-weight:600}
.ledr[data-k="born"]{color:var(--rock)}
.ledr[data-k="graft"], .ledr[data-k="self"]{color:var(--self)}
.ledr[data-k="decl"]{color:var(--faint)}
.verbs{display:flex; flex-wrap:wrap; gap:7px}
/* real mode: read-only EXCEPT the links that go to the real thing (Sam,
   2026-08-03). A frozen button that still looks pressable is a lie told once
   per click, so the sandbox verbs stop being controls here: they stay legible,
   because they are how this page explains what can happen to a mineral, but they
   are visibly not offering to do it. The "in app" link beside each is the live
   path, and it is the only thing still clickable. */
html.ro .vb{pointer-events:none; opacity:.45; box-shadow:none}
html.ro #newBtn, html.ro #fileBtn, html.ro #undoBtn, html.ro #redoBtn{display:none}
html.ro .applink{pointer-events:auto; opacity:1}
button.vb{font-family:var(--ui); font-size:12px; font-weight:550;
  background:var(--panel); color:var(--soft); border:1px solid var(--line2);
  border-radius:8px; padding:7px 13px; cursor:pointer;
  transition:color 120ms, border-color 120ms, box-shadow 120ms}
button.vb:hover:not(:disabled){color:var(--accent); border-color:var(--accent);
  box-shadow:var(--shadow-s)}
button.vb:disabled{opacity:.38; cursor:not-allowed}
button.vb:focus-visible{outline:none; box-shadow:0 0 0 3px rgba(84,87,214,.28)}
button.vb.danger{color:var(--bad); border-color:#F3CBD3}
button.vb.danger:hover:not(:disabled){color:var(--bad); border-color:var(--bad);
  background:#FDF2F4; box-shadow:none}
button.vb.mini{padding:4px 10px; font-size:11px}
.change{margin:12px 0 6px; border:1px solid #DBDCF5; border-left:3px solid var(--accent);
  border-radius:0 9px 9px 0; padding:10px 12px; display:grid; gap:4px; background:#F7F7FE}
.chg-a{font-size:10px; font-weight:650; letter-spacing:.08em; text-transform:uppercase;
  color:var(--accent)}
.chg-d{font-size:11.5px; color:var(--soft); line-height:1.45}
.leaver{margin-top:16px; padding-top:13px; border-top:1px solid var(--line);
  font-size:11.5px; color:var(--soft); line-height:1.55}
.leaver b{color:var(--ink); font-weight:650}
.empty{color:var(--faint); font-size:12px}
.actnote{font-size:11.5px; color:var(--soft); background:var(--panel2); border-radius:9px;
  padding:9px 12px; margin:8px 0 0; line-height:1.5}
.actnote b{color:var(--rock); font-weight:650}
.reqc{border:1px solid var(--line2); border-radius:9px; padding:9px 12px; margin:0 0 8px;
  background:var(--panel); box-shadow:var(--shadow-s)}
.reqc[data-dir="in"]{border-left:3px solid var(--accent)}
.reqc[data-dir="out"]{border-left:3px solid var(--line2)}
.rqt{font-size:12px; color:var(--ink); font-weight:550; line-height:1.4}
.rqs{font-size:10.5px; color:var(--faint); margin-top:2px}
.rqa{display:flex; gap:6px; margin-top:8px}
.rqa .vb{padding:5px 11px; font-size:11.5px}

/* ---------------------------------------------------------------- menus --- */
.menu{position:fixed; z-index:80; min-width:210px; max-width:320px; max-height:340px;
  overflow-y:auto; background:var(--panel); border:1px solid var(--line); border-radius:11px;
  box-shadow:var(--shadow-l); padding:6px}
.menu .mi{display:block; width:100%; text-align:left; background:transparent; border:none;
  border-radius:7px; padding:8px 11px; cursor:pointer; color:var(--ink);
  font-family:var(--ui); font-size:12.5px; font-weight:500}
.menu .mi:hover:not(:disabled){background:#F3F4FE; color:var(--accent)}
.menu .mi:disabled{opacity:.4; cursor:not-allowed}
.menu .mi[aria-pressed="true"]{color:var(--accent)}
.menu .mi .note{display:block; font-size:10.5px; font-weight:400; color:var(--faint); margin-top:1px}
.menu .msep{height:1px; background:var(--line); margin:5px 9px}
.menu .mhead{font-size:9.5px; font-weight:650; letter-spacing:.07em;
  text-transform:uppercase; color:var(--faint); padding:7px 11px 3px}

/* ---------------------------------------------------------------- drawer --- */
.drawer{position:absolute; left:0; right:0; bottom:0; max-height:46%; z-index:8;
  background:rgba(255,255,255,.96); backdrop-filter:blur(10px);
  border-top:1px solid var(--line2); box-shadow:0 -8px 30px rgba(26,31,54,.1);
  transform:translateY(102%); transition:transform 200ms ease-out;
  display:flex; flex-direction:column}
.drawer[data-open="1"]{transform:translateY(0)}
@media (prefers-reduced-motion:reduce){ .drawer{transition:none} }
.dhead{display:flex; align-items:center; gap:12px; padding:10px 18px;
  border-bottom:1px solid var(--line)}
.dhead h3{font-size:10.5px; font-weight:650; letter-spacing:.08em;
  text-transform:uppercase; color:var(--faint); margin:0}
.dhead .fcount{font-size:11.5px; color:var(--soft)}
.dhead .x{margin-left:auto}
.dbody{overflow-y:auto; padding:2px 18px 16px}
.v{display:grid; grid-template-columns:78px 1fr; gap:14px; padding:11px 0;
  border-top:1px solid var(--line); cursor:pointer; align-items:start}
.v:first-pebble{border-top:none}
.v:hover .vmsg{color:var(--ink)}
.sev{font-size:9.5px; font-weight:650; letter-spacing:.07em; text-transform:uppercase;
  color:var(--faint); padding-top:2px}
.sev[data-s="blocked"]{color:var(--bad)}
.sev[data-s="false"]{color:var(--warn)}
.sev[data-s="unbuilt"]{color:var(--plat)}
.vmsg{font-size:12.5px; color:var(--soft); transition:color 120ms; max-width:100ch}
.vmsg b{color:var(--ink); font-weight:650}
.vrule{font-size:10.5px; color:var(--faint); display:block; margin-top:3px}
.clean{font-size:12.5px; color:var(--good); padding:13px 0}

/* ---------------------------------------------------------------- cmd-k --- */
.ckwrap{position:fixed; inset:0; z-index:90; display:none; align-items:flex-start;
  justify-content:center; padding-top:14vh;
  background:rgba(26,31,54,.32); backdrop-filter:blur(3px)}
.ckwrap[data-open="1"]{display:flex}
.ck{width:min(480px, 92vw); background:var(--panel); border:1px solid var(--line);
  border-radius:13px; box-shadow:var(--shadow-l); overflow:hidden}
.ck input{width:100%; background:transparent; border:none; outline:none; color:var(--ink);
  font-family:var(--ui); font-size:14.5px; padding:14px 17px; border-bottom:1px solid var(--line)}
.ck .list{max-height:300px; overflow-y:auto; padding:6px}

<script>
/* ===========================================================================
   MODEL. Three separate WHO relationships per box, each its own dial:
     owner: 'self' | rockId  - brain, bills, final authority. MOVABLE pointer
            (both owners consent; an owning rock must hold an edge). Decoupled
            from lineage, exactly as home was.
     home:  rockId | null    - MANAGEMENT: the rock carrying seat, registry,
            installs, imprint. Movable, receiving rock consents. Rocks: none.
     runs:  'crads-ai' | 'self' | 'owner' - HOSTING: whose metal. Crads AI by
            default; own metal by approved request; the owner's metal is
            enterprise-only (rock-owned boxes).
   stampedBy/origin stay FROZEN lineage. status/kind/consent/support as ruled
   26-28 Jul. No god mode: every view is a seat; Crads AI is the overview
   seat, contracts-only.
   ========================================================================= */
const REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
/* ?real=1: this page is showing THIS box's own network, read-only. Declared
   up here because the File menu consults it, and a const read before its
   declaration is a ReferenceError, not a falsy default. */
const REAL = new URLSearchParams(location.search).get('real') === '1';
if (REAL) document.documentElement.classList.add('ro');

const mk = (id, rock, label, over = {}) => {
  const o = { id, rocks: rock === null ? [] : (Array.isArray(rock) ? rock : [rock]),
    label, origin: rock === null ? 'self' : 'stamped', grafts: [],
    owner: 'self', runs: 'crads-ai', consent: true, support: false,
    pebbles: false, status: 'active', ...over };
  o.stampedBy = o.origin === 'stamped' ? (o.rocks[0] || null) : null;
  /* a rock is born homeless: rocks hold community access only (ruled) */
  o.home = o.pebbles ? null : (o.home !== undefined ? o.home : o.stampedBy);
  o.birthKind = o.pebbles ? 'rock' : 'pebble';
  return o;
};

const PRESETS = {
  ic: () => ([
    mk('ic',  null, 'Acme CoLab', { pebbles:true, framework:'the five pillars' }),
    mk('m8',  ['ic','cb'], 'In two communities',
      { grafts:[{ from:'Second community', what:'their framework', state:'declined' }] }),
    mk('dept','ic', 'Programme team', { owner:'ic' }),
    mk('co',  'ic', 'Member with a company', { pebbles:true, origin:'self', runs:'self',
      grafts:[{ from:'Acme CoLab', what:'five pillars', state:'accepted' }] }),
    mk('co1', 'co', 'Staff mineral A', { owner:'co', runs:'owner' }),
    mk('co2', 'co', 'Staff mineral B', { owner:'co' }),
    mk('cb',  null, 'Second community', { pebbles:true, framework:'their framework' })
  ]),
  hostmix: () => ([
    mk('hub', null,  'Community rock', { pebbles:true, framework:'its method' }),
    mk('hm',  'hub', 'Hosted member'),
    mk('ss',  null,  'Self-started, hosted', { rocks:['hub'] }),
    mk('om',  'hub', 'Member on own metal', { runs:'self' })
  ]),
  enterprise: () => ([
    mk('co', null, 'Acme', { pebbles:true, runs:'self' }),
    mk('e1', 'co', 'Staff mineral, company metal', { owner:'co', runs:'owner' }),
    mk('e2', 'co', 'Staff mineral, company metal 2', { owner:'co', runs:'owner' }),
    mk('e3', 'co', 'Contractor mineral, Crads-hosted', { owner:'co' })
  ]),
  fresh: () => ([
    mk('you', null, 'Your rock', { pebbles:true, framework:'your method' })
  ])
};
const PRESET_INFO = {
  ic:         { label:'Acme CoLab', note:'the worked example: two communities, a work mineral, a company' },
  hostmix:    { label:'Hosting mix', note:'every hosting shape on one sheet' },
  enterprise: { label:'Enterprise metal', note:'a company on its own infrastructure' },
  fresh:      { label:'Fresh rock', note:'start empty: stamp and invite from scratch' }
};

/* Served in the app at /topology. The opening world and seat come from the
   query string so each face can land its user somewhere sensible without
   forking this file (the harriet-copy pattern this replaces):
     ?open=<preset>   one of PRESETS (ic | hostmix | enterprise | fresh)
     ?seat=<id>       CRADS or a box id IN that preset
   Anything missing or unrecognised falls back to the reference default
   (the Acme CoLab worked example, seen from the platform seat). */
const BOOT_Q = new URLSearchParams(location.search);
const BOOT_PRESET = PRESETS[BOOT_Q.get('open')] ? BOOT_Q.get('open') : 'ic';
let nodes = PRESETS[BOOT_PRESET]();
let sel = nodes[0] ? nodes[0].id : 'CRADS', layer = 'own', seq = 0, preset = BOOT_PRESET;
/* every view is a seat. 'CRADS' = the platform: sees almost everything,
   contracts only. A box id = that box's seat. */
let actingAs = (() => {
  const s = BOOT_Q.get('seat');
  return (s === 'CRADS' || (s && nodes.some(n => n.id === s))) ? s : 'CRADS';
})();
let requests = [], reqSeq = 0;

const byId = (id) => nodes.find(n => n.id === id);
const rocksAll = (n) => (n.rocks || []).map(id => byId(id)).filter(Boolean);
const chOf = (n) => nodes.filter(x => (x.rocks || []).includes(n.id));
/* every box below n (its pebbles, their pebbles, ...). Joining a rock that
   is one of your descendants would loop (rock -> pebble -> rock), so the
   join/invite flows exclude these. */
function descendantsOf(n){
  const set = new Set(), stack = [n.id];
  while (stack.length){ const id = stack.pop();
    nodes.filter(c => (c.rocks || []).includes(id)).forEach(c => {
      if (!set.has(c.id)){ set.add(c.id); stack.push(c.id); } }); }
  return set;
}
/* can box `pebble` join rock `rock`? not itself, not already joined, not a loop */
function canJoin(pebble, rock){
  return rock && rock.pebbles && rock.id !== pebble.id
    && !(pebble.rocks || []).includes(rock.id)
    && !descendantsOf(pebble).has(rock.id);
}
const layoutRock = (n) => rocksAll(n)[0] || null;
function ownerOf(n){ return n.owner === 'self' ? n : (byId(n.owner) || null); }
function stamperOf(n){ return n.stampedBy ? (byId(n.stampedBy) || null) : null; }
function homeOf(n){ return n.home ? (byId(n.home) || null) : null; }
function homeConnected(n){
  if (n.pebbles) return null;
  const h = homeOf(n);
  if (!h || h.status === 'left' || n.status === 'left') return null;
  return (n.rocks || []).includes(h.id) ? h : null;
}
function ownerConnected(n){
  if (n.owner === 'self') return n;
  const o = ownerOf(n);
  if (!o || o.status === 'left' || n.status === 'left') return null;
  return (n.rocks || []).includes(o.id) ? o : null;
}
function runnerOf(n){
  if (n.runs === 'self') return n;
  if (n.runs === 'owner') return n.owner === 'self' ? null : ownerConnected(n);
  return null;   /* crads-ai */
}
function hostedPayerOf(n){
  if (n.runs !== 'crads-ai') return null;
  const h = homeConnected(n);
  if (h) return h;                       /* the home rock carries its pebbles */
  if (n.owner === 'self') return n;      /* self-owned + homeless: own bill */
  return ownerConnected(n);              /* rock-owned: the owner's bill */
}
/* the seat that ANSWERS for a box: itself when self-owned, its owner's seat */
const answerSeat = (n) => n.owner === 'self' ? n.id : n.owner;
const seatName = (key) => key === 'CRADS' ? 'Crads AI' : (byId(key) || {}).label || 'a gone mineral';
const inboxOf = (key) => requests.filter(r => r.status === 'pending' && r.to === key);
const sentBy = (key) => requests.filter(r => r.status === 'pending' && r.from === key);

/* what one box may see: itself, its rocks, its direct pebbles */
function seenFrom(id){
  const me = byId(id);
  if (!me) return { list: nodes, rel: {}, hidden: 0 };
  const rel = { [id]: 'you' };
  (me.rocks || []).forEach(pid => { if (byId(pid)) rel[pid] = 'your rock'; });
  chOf(me).forEach(c => { if (!rel[c.id]) rel[c.id] = 'your pebble'; });
  const list = nodes.filter(n => rel[n.id]);
  return { list, rel, hidden: nodes.length - list.length };
}

/* flows: content + installs down, pulse up. Home delivery-pause (hpause) and
   the O6 consent gate close the downward channels; pulse follows liveness. */
function flows(n, p){
  if (!p) return null;
  const live = n.status === 'active' && p.status === 'active';
  const stopped = live ? null : (n.status !== 'active' ? `this mineral ${n.status}` : `rock ${p.status}`);
  const gated = n.owner === 'self' && n.consent === false;
  const contentOnly = p !== homeOf(n);
  const hp = !!n.hpause && p === homeOf(n);
  return {
    content: { on: live && !hp, why: stopped || (hp ? 'home paused delivery' : null) },
    infra:   { on: live && !hp && !gated && !contentOnly,
               why: stopped || (hp ? 'home paused delivery'
                 : contentOnly ? 'content-only rock' : gated ? 'installs refused (O6)' : null) },
    up:      { on: live, why: stopped }
  };
}

function reaches(n){
  const out = [];
  const own = ownerOf(n);
  for (const p of rocksAll(n)){
    const f = flows(n, p);
    const rows = [];
    rows.push({ label:'sends content down', state: f.content.on ? 'open' : 'stopped', why: f.content.why });
    rows.push({ label:'installs skills + cadence', state: f.infra.on ? 'open' : 'stopped', why: f.infra.why });
    rows.push({ label:'reads this brain',
      state: own === p ? 'open' : (n.support ? 'temp' : 'stopped'),
      why: own === p ? 'it owns it' : (n.support ? 'granted, expires' : 'not its repo') });
    if (own === p)
      rows.push({ label:'can shut the door', state:'open',
        why:'ownership: the operator executes its order' });
    if (n.runs === 'owner' && own === p){
      rows.push({ label:'operates the machine', state:'open', why:'enterprise metal' });
      rows.push({ label:'sees host telemetry', state:'open', why:'it operates the VM' });
    }
    if (homeOf(n) === p){
      rows.push({ label:'receives heartbeats', state:'open', why:'liveness + version, never content' });
      rows.push({ label:'holds the registry row', state:'open', why:'it manages this mineral' });
    } else {
      rows.push({ label:'knows membership + identity', state:'open', why:'its edge' });
      rows.push({ label:'sees machine metadata', state:'stopped', why:'community tier' });
    }
    out.push({ name: p.label,
      sub: [own === p ? 'owner' : '', homeOf(n) === p ? 'manager' : 'community'].filter(Boolean).join(' + ') + ' rock',
      tone:'rock', arrows: rows });
  }
  {
    const arrows = [{ label:'ships machine updates', state:'open', why:'the machinery layer, every mineral' }];
    if (n.runs === 'crads-ai'){
      arrows.push({ label:'operates the machine', state:'open', why:'provision, update, restart. Ops only' });
      arrows.push({ label:'sees host telemetry', state:'open', why:'it operates the VM' });
    } else {
      arrows.push({ label:'sees host telemetry', state:'stopped', why:'not the operator here' });
    }
    arrows.push({ label:'can shut the door', state:'stopped',
      why:'operator, not owner: it executes the owner\u2019s order' });
    arrows.push({ label:'reads this brain', state:'stopped', why:'never: operating is ops only' });
    out.push({ name:'Crads AI', sub:'the platform', tone:'plat', arrows });
  }
  const person = [{ label:'opens it', state:'open', why:'their own device key' }];
  if (n.owner === 'self') person.push({ label:'can shut the door', state:'open',
    why:'ownership: shutdown is theirs to order' });
  if (n.runs === 'self') person.push({ label:'operates the machine', state:'open', why:'their own metal' });
  out.push({ name:'Whoever uses it', sub:'the device key', tone:'self', arrows: person });
  return out;
}

/* --------------------------------------------------------------- money ---
   The pricing layer. Every rate lives in PRICE and nothing else hard-codes a
   figure, so the Value view is a live model: change a rate in the Key panel
   and every ledger, net line and the fleet chip re-derive from it.

   Three layers, per the value-model audit (2026-07-26) + its addenda: owners
   pay Anthropic for brains, rocks pay Crads AI for seats and platform, members
   pay rocks. A managed pebble pays Crads AI nothing.                        */
const PRICE_DEFAULTS = {
  brain:      100,  /* Anthropic, per owned brain, paid by the owner         */
  hosted:      49,  /* a seat Crads AI runs, carried by the managing rock    */
  standalone: 199,  /* a box carrying its own seat: no rock, so no tier one  */
  machinery:   29,  /* self-run or owner-run: machinery only, we host none   */
  hostCost:    15,  /* CRADS AI OVERHEAD: what one hosted machine costs to run
                       (VM + backups + tunnel). Cost, not revenue: it burdens

function ledger(n){

  const ch = live(n) ? chOf(n).filter(live) : [];

  const ownedBrains = (n.owner === 'self' ? 1 : 0) + ownedKids.length;

  const simK = (n.pebbles && live(n)) ? (n.sim || 0) : 0;
  const out = (k, t, amt) => rows.push({ k, t, amt, dir:'out' });

  if (ownedBrains) out('model',
    `pays Anthropic ~${money(ownedBrains * PRICE.brain)}/mo, ${ownedBrains} brain${ownedBrains > 1 ? 's' : ''}`,
    ownedBrains * PRICE.brain);

    `pays Crads AI ${money(runSeats.length * PRICE.machinery)}/mo machinery, ${

        tierIndex(h, commKids) + 1}: ${

      ? `pays Crads AI ${money(amt)}/mo, carries its own seat${

      : `pays Crads AI ${money(amt)}/mo, ${hostedBoxes.length + simK} hosted seat${

                             : `pays ${money(amt)}/mo community fee to ${pp.label}`, amt);
  });

  ownedKids.forEach(c => (c.rocks || []).filter(id => id !== n.id)
    .map(id => byId(id)).filter(p => p && live(p))
    .forEach(p => out('membership',
      `pays ${money(PRICE.commMember)}/mo community fee to ${p.label} for ${c.label}`, PRICE.commMember)));
  if (n.owner !== 'self' && ownerOf(n)) rows.push({ k:'none', dir:'out', amt:0,
    t:`pays nothing, ${ownerOf(n).label} owns it` });
  if (paying.length + simK){
    const inHome = paying.filter(c => c.home === n.id && !c.pebbles).length + simK;
    const inComm = paying.length - (inHome - simK);
    const amt = inHome * PRICE.homeMember + inComm * PRICE.commMember;
    rows.push({ k:'in', dir:'in', amt,

        .filter(Boolean).join(' + ')} member${paying.length + simK > 1 ? 's' : ''}${
        simK ? ` (${simK} sim)` : ''}` });
  }
  /* the rock's own P&L: does carrying members leave it a business? */
  const paid = rows.reduce((s, r) => s + (r.dir === 'out' ? (r.amt || 0) : 0), 0);
  const got  = rows.reduce((s, r) => s + (r.dir === 'in'  ? (r.amt || 0) : 0), 0);
  if (got) rows.push({ k: got >= paid ? 'net' : 'neg', dir:'net', amt: got - paid, got,
    /* a margin percentage of a loss is noise: name the deficit and both sides */

    const ps = rocksAll(n);
    const ch = chOf(n);
    const own = ownerOf(n);
    const orphaned = (n.rocks || []).some(id => !byId(id));
    if (n.owner !== 'self' && !own)
      add(n, 'blocked', `<b>${n.label}</b> is owned by a rock that no longer exists.`,
        'owner pointer dangling');

      add(n, 'blocked', `<b>${n.label}</b> is owned by ${own.label} without an edge to it. Ownership requires the relationship.`,
        'ruling 2026-07-28: no absentee owners');

      add(n, 'blocked', `<b>${n.label}</b> is rock-owned but run by whoever uses it. The factory and the panel both reject this.`,
        'D60 invariant 6 / keystone 8');

      add(n, 'false', `<b>${n.label}</b> ships membership.md written for a mineral its user owns. Its promises (your brain, no read-back, it goes with you) are false here.`,

      if (n.status === 'active')
        add(n, 'dead', `<b>${n.label}</b> is active, but its rock <b>${p.label}</b> is ${p.status}. Nothing reaches it from there.`,
          'delivery flows only while status is active');
    });
    if (orphaned)
      add(n, 'dead', `<b>${n.label}</b> points at a rock that no longer exists.`, 'orphan');
    if (n.status === 'left' && ch.length)
      add(n, 'dead', `<b>${n.label}</b> has left but still supplies ${ch.length} mineral${ch.length>1?'es':''}.`,
        'no defined behaviour for a departed rock');
    if (ch.length && !n.pebbles)
      add(n, 'blocked', `<b>${n.label}</b> is a pebble supplying ${ch.length} mineral${ch.length>1?'es':''}. A pebble has no factory.`,
        'rocks and pebbles: only a rock supplies minerals');
    if (n.pebbles && ps.length)
      add(n, 'unbuilt', `<b>${n.label}</b> is a rock inside another rock\u2019s tree. Nesting is specced as a successor, not built.`,
        'D60 scope: federated nesting');
    if ((n.pebbles ? 'rock' : 'pebble') !== n.birthKind)
      add(n, 'unbuilt', `<b>${n.label}</b> was born a ${n.birthKind}. Promotion pricing is automatic; the re-stamp mechanics are open.`,

/* --------------------------------------------------------------- gating ---
   guard: would this dial-turn or verb break a ratified rule? */
function guard(n, key, val){
  if (key === 'pebbles' && val === false && chOf(n).length)
    return 'it supplies minerals: move or delete its pebbles first';
  if (key === 'runs'){
    if (val === 'self' && n.owner !== 'self')
      return 'a rock-owned mineral cannot run on the user\u2019s metal (D60)';
    if (val === 'owner'){
      if (n.owner === 'self') return 'owner-metal is enterprise-only: a rock must own it';
      if (n.pebbles) return 'a rock is never run on its owner\u2019s metal (F5)';
      const o = ownerOf(n);
      if (o && o.runs !== 'self')
        return `the owner has no metal: ${o.label} is hosted itself. Move the owner to its own metal first`;
    }
  }
  if (key === 'support' && val === true && n.owner !== 'self')
    return 'does nothing: owning already includes reading (D60)';
  if (key === 'consent' && val === false && n.owner !== 'self')
    return 'does nothing: the O6 gate only exists on a self-owned mineral';
  if (key === 'hpause'){
    if (n.pebbles) return 'rocks have no manager to pause them';
    if (!homeConnected(n)) return 'no connected manager: nothing carried to pause';

}
/* ruled consequences applied WITH a change, and said aloud */
function cascade(n, key, val){
  const notes = [];

    const h = homeOf(n);
    if (h) notes.push(`management by ${h.label} ends: rocks carry themselves`);
    n.home = null;
    if (n.runs === 'owner'){ n.runs = 'crads-ai'; notes.push('a rock never runs on its owner\u2019s metal: Crads AI hosts it now'); }
    if (n.runs === 'crads-ai') notes.push(n.owner === 'self'
      ? 'its hosted seat moves onto its own bill'
      : 'its hosted seat moves onto its owner\u2019s bill (an owned rock is billed to its owner)');
    notes.push('factory + registry enabled; pricing re-tiers automatically');
  }
  if (key === 'pebbles' && val === false && n.pebbles)
    notes.push('factory + registry disabled; unmanaged until a rock takes it on');
  if (key === 'status'){
    if (val === 'paused') notes.push('delivery and flows stop; every contract persists');
    if (val === 'active' && n.status === 'paused') notes.push('delivery and flows resume');
    if (val === 'active' && n.status === 'left') notes.push('rejoin: ties and bills resume as they were');
  }
  if (key === 'owner'){
    if (val !== 'self' && n.runs === 'self'){ n.runs = 'crads-ai';
      notes.push('rock ownership: self-run ends, Crads AI hosts (D60)'); }
    if (val === 'self' && n.runs === 'owner'){ n.runs = 'crads-ai';
      notes.push('member ownership: owner-metal ends, Crads AI hosts'); }
    if (homeOf(n)) notes.push(`management stays with ${homeOf(n).label} unless you change that dial`);
  }

  if (key === 'status') return v === 'left' ? (n.owner !== 'self' ? 'decommission' : 'go dark')
    : v === 'paused' ? 'pause' : n.status === 'left' ? 'rejoin' : 'resume';
  if (key === 'runs') return v === 'self' ? 'move to own metal'
    : v === 'owner' ? 'move to owner\u2019s metal' : 'move to Crads AI hosting';
  if (key === 'support') return v ? 'grant read access' : 'revoke read access';
  if (key === 'consent') return v ? 'allow installs' : 'refuse installs';

let lastChange = null;
function moneySnap(n){

    owner: n.owner,
    reads: n.owner !== 'self' ? 'the owner, always' : (n.support ? 'granted, expires' : 'nobody above'),
    installs: n.owner !== 'self' ? 'the owner decides' : (n.consent ? 'by consent' : 'refused') };

    d.push(`owner: ${before.owner === 'self' ? 'the member' : seatName(before.owner)} -> ${
      after.owner === 'self' ? 'the member' : seatName(after.owner)}`);
  if (before.seat !== after.seat)
    d.push(`${before.seat.replace('seat: ', 'seat was ')} -> ${after.seat.replace('seat: ', '')}`);
  before.fees.filter(x => !after.fees.includes(x)).forEach(x => d.push(`ended: ${x}`));
  after.fees.filter(x => !before.fees.includes(x)).forEach(x => d.push(`now: ${x}`));
  if (before.reads !== after.reads) d.push(`brain read: ${before.reads} -> ${after.reads}`);
  if (before.installs !== after.installs) d.push(`skill installs: ${before.installs} -> ${after.installs}`);

/* ----------------------------------------------------------- history ----- */
let undoStack = [], redoStack = [];
const snapState = () => JSON.stringify({ nodes, sel, seq, preset, actingAs,
  requests: requests.map(r => ({ ...r })), reqSeq });
function pushHistory(){
  undoStack.push(snapState());
  if (undoStack.length > 100) undoStack.shift();
  redoStack = [];
}
function restoreState(s){
  const o = JSON.parse(s);
  nodes = o.nodes; sel = o.sel; seq = o.seq; preset = o.preset;
  actingAs = o.actingAs || 'CRADS'; requests = o.requests || []; reqSeq = o.reqSeq || 0;
  lastChange = null;

function doUndo(){ if (!undoStack.length) return;
  redoStack.push(snapState()); restoreState(undoStack.pop()); }
function doRedo(){ if (!redoStack.length) return;
  undoStack.push(snapState()); restoreState(redoStack.pop()); }

function runVerb(n, key, val){
  if (guard(n, key, val)) return;
  pushHistory();

  const notes = cascade(n, key, val);
  n[key] = val;
  announce(n, verbFor(n, key, val), before, notes);
  render();

/* ----------------------------------------------------------- requests ----

        n.rocks = (n.rocks || []).concat(rock.id);
        if (n.owner !== 'self' && ownerOf(n) && ownerOf(n) !== rock)
          notes.push(`${ownerOf(n).label} consents and pays the community fee (keystone 4)`);
        chainGraft(rock, n);
      } else {
        notes.push(`refused: ${n.label} cannot join ${rock ? rock.label : 'that rock'} (already in, or it would loop)`);
      }
      break; }
    case 'rehome': {
      const rock = byId(r.extra);
      if (rock){
        const had = homeOf(n);
        n.home = rock.id;
        notes.push(had ? `${had.label} drops to community tier` : 'managed for the first time');
        (n.grafts || []).filter(g => g.from === rock.label && g.state === 'declined')
          .forEach(g => { g.state = 're-offered'; chainGraft(rock, n); });
      }
      break; }
    case 'xfer': {
      notes.push(...cascade(n, 'owner', r.extra));
      n.owner = r.extra;
      break; }
    case 'rejoin': notes.push(...cascade(n, 'status', 'active')); n.status = 'active'; break;
    case 'graft': {
      const rock = byId(r.extra);
      const g = (n.grafts || []).find(x => rock && x.from === rock.label && x.state === 're-offered');
      if (g) g.state = 'accepted';
      else n.grafts = (n.grafts || []).concat({ from: rock ? rock.label : '?',
        what: rock && rock.framework || 'its framework', state: 'accepted' });
      notes.push('graft installed: namespaced, attributed forever');
      break; }
    case 'askRead': n.support = true; notes.push('read granted: temporary, revocable'); break;
    case 'askInstall': n.consent = true; notes.push('install consent granted (O6 open)'); break;
    case 'ownMetal': notes.push(...cascade(n, 'runs', 'self')); n.runs = 'self';
      notes.push('Crads AI approved: machinery fee begins, the hosted seat ends'); break;
  }
  if (!accept && r.kind === 'graft'){
    const rock = byId(r.extra);
    const g = (n.grafts || []).find(x => rock && x.from === rock.label && x.state === 're-offered');
    if (g) g.state = 'declined';
    else if (rock) n.grafts = (n.grafts || []).concat({ from: rock.label,
      what: rock.framework || 'its framework', state: 'declined' });
  }
  announce(n, `${accept ? 'accepted' : 'declined'}: ${r.label}`, before, notes);
  requests = requests.filter(x => x.status === 'pending');
  render();
}

/* --------------------------------------------------------------- layout --- */
let NW = 212, NH = 100, VGAP = 92;
const HGAP = 38;
function measure(id, w = {}, kidsOf){
  const ch = kidsOf(id);
  if (!ch.length){ w[id] = NW; return w; }
  ch.forEach(c => measure(c.id, w, kidsOf));
  w[id] = Math.max(NW, ch.reduce((s,c) => s + w[c.id], 0) + HGAP*(ch.length-1));
  return w;
}
function place(id, left, depth, w, pos, kidsOf){
  pos[id] = { x: left + w[id]/2 - NW/2, y: depth*(NH+VGAP) };
  const fixed = byId(id);
  if (fixed && fixed.fx != null) pos[id] = { x: fixed.fx, y: fixed.fy };
  let x = left;
  kidsOf(id).forEach(c => { place(c.id, x, depth+1, w, pos, kidsOf); x += w[c.id] + HGAP; });
  return pos;
}
const curve = (x1,y1,x2,y2) => `M${x1} ${y1} C${x1} ${y1+44}, ${x2} ${y2-44}, ${x2} ${y2}`;
function bez(x1,y1,x2,y2,t){
  const c1y = y1+44, c2y = y2-44, m = 1-t;
  return [(m*m*m*x1 + 3*m*m*t*x1 + 3*m*t*t*x2 + t*t*t*x2).toFixed(1),
          (m*m*m*y1 + 3*m*m*t*c1y + 3*m*t*t*c2y + t*t*t*y2).toFixed(1)];
}

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
function ownerLbl(n){ return n.owner === 'self' ? n.label : (ownerOf(n) ? ownerOf(n).label : 'a gone owner'); }
function runnerLbl(n){ return n.runs === 'crads-ai' ? 'Crads AI'
  : n.runs === 'self' ? n.label : (runnerOf(n) ? runnerOf(n).label : 'nobody'); }
function ownerTone(n){ return n.owner === 'self' ? 'self' : 'rock'; }
function runTone(n){ return n.runs === 'crads-ai' ? 'crads' : n.runs === 'self' ? 'self' : 'rock'; }

function renderTree(vio){
  const view = actingAs !== 'CRADS' ? seenFrom(actingAs) : null;
  const list = view ? view.list : nodes;
  const REL = view ? view.rel : {};
  const inList = (n) => list.some(x => x.id === n.id);
  const kidsOf = (id) => list.filter(n => { const lp = layoutRock(n); return lp && lp.id === id && inList(lp); });
  const roots = list.filter(n => !(layoutRock(n) && inList(layoutRock(n))));
  const w = {}; roots.forEach(r => measure(r.id, w, kidsOf));
  const pos = {}; let ox = NW + 84;
  roots.forEach(r => { place(r.id, ox, 0, w, pos, kidsOf); ox += w[r.id] + HGAP*2; });
  const maxX = Math.max(NW, ...Object.values(pos).map(p => p.x + NW));

  const edges = [];
  list.forEach(n => rocksAll(n).forEach(p => {
    if (pos[p.id] && pos[n.id]) edges.push({ n, p });
  }));
  const buildWires = (bottom) => edges.map(({ n, p }) => {
    const a = pos[p.id], b = pos[n.id];
    const x1 = a.x + NW/2, y1 = a.y + bottom(p), x2 = b.x + NW/2, y2 = b.y;
    const f = flows(n, p);
    if (layer === 'value'){
      const dead = n.status === 'left' || p.status === 'left';
      const own = n.owner !== 'self' ? ownerOf(n) : null;
      const paid = !dead && (n.owner === 'self' || (own && own !== p));
      const lbl = dead ? 'no fee, left'
        : n.owner === 'self' ? ((!n.pebbles && homeOf(n) === p) ? 'anchor fee' : 'community fee')
        : (own && own !== p) ? `${own.label} pays the fee` : 'no fee, owned';
      const tone = paid ? 'var(--self)' : 'var(--rock)';
      const mx = (x1+x2)/2, my = (y1+y2)/2 + 3, w2 = lbl.length*5.6+14;
      const path = paid
        ? `<path d="${curve(x2,y2,x1,y1)}" fill="none" stroke="${tone}" stroke-width="1.3"
            marker-end="url(#arw-pay)"/>`
        : `<path d="${curve(x1,y1,x2,y2)}" fill="none" stroke="${tone}" stroke-width="1.2"
            stroke-dasharray="5 4" opacity=".7"/>`;
      return path + `<rect x="${mx-w2/2}" y="${my-10}" width="${w2}" height="15" rx="3" fill="var(--canvas)"/>
        <text x="${mx}" y="${my+1}" text-anchor="middle" font-family="system-ui,sans-serif"
          font-size="9" fill="${tone}">${esc(lbl)}</text>`;
    }
    if (layer === 'origin'){
      const isStamp = n.origin !== 'self' && p === stamperOf(n);
      const lbl = isStamp ? `stamped by ${p.label}` : 'joined later, no seed';
      const tone = isStamp ? 'var(--rock)' : 'var(--faint)';
      const mx = (x1+x2)/2, my = (y1+y2)/2 + 3, w2 = lbl.length*5.6+14;
      return `<path d="${curve(x1,y1,x2,y2)}" fill="none" stroke="${tone}"
          stroke-width="${isStamp ? 1.5 : 1.1}" ${isStamp ? '' : 'stroke-dasharray="2 5"'}/>
        <rect x="${mx-w2/2}" y="${my-10}" width="${w2}" height="15" rx="3" fill="var(--canvas)"/>
        <text x="${mx}" y="${my+1}" text-anchor="middle" font-family="system-ui,sans-serif"
          font-size="9" fill="${tone}">${esc(lbl)}</text>`;
    }
    if (layer !== 'data'){
      const tone = n.owner !== 'self' && ownerOf(n) === p ? 'var(--rock)' : 'var(--self)';
      return `<path d="${curve(x1,y1,x2,y2)}" fill="none" stroke="${tone}" stroke-width="1.3"
        ${f.content.on ? 'opacity=".75"' : 'stroke-dasharray="3 5" opacity=".35"'}/>`;
    }
    const wid = `w-${n.id}-${p.id}`;
    const moving = f.content.on || f.infra.on || f.up.on;
    let out = `<path id="${wid}" d="${curve(x1,y1,x2,y2)}" fill="none" stroke="var(--line2)"
      stroke-width="1.25" ${moving ? '' : 'stroke-dasharray="3 5" opacity=".55"'}/>`;
    const shape = (r, col, hollow) => hollow
      ? `r="${r}" fill="none" stroke="${col}" stroke-width="1.4"` : `r="${r}" fill="${col}"`;
    const mover = (r, col, hollow, dur, begin, rev) =>
      `<circle ${shape(r,col,hollow)}><animateMotion dur="${dur}s" repeatCount="indefinite"
        begin="${begin}s" ${rev ? 'keyPoints="1;0" keyTimes="0;1" calcMode="linear"' : ''}>
        <mpath href="#${wid}"/></animateMotion></circle>`;
    const still = (t, r, col, hollow) => {
      const [px,py] = bez(x1,y1,x2,y2,t);
      return `<circle ${shape(r,col,hollow)} cx="${px}" cy="${py}"/>`;
    };
    if (REDUCED){
      if (f.content.on) out += [0.28,0.52,0.76].map(t => still(t,2.7,'var(--rock)',false)).join('');
      if (f.infra.on)   out += [0.40,0.64].map(t => still(t,2.5,'var(--rock)',true)).join('');
      if (f.up.on)      out += [0.34,0.66].map(t => still(t,2.5,'var(--self)',false)).join('');
    } else {
      if (f.content.on) out += [0,0.9,1.8].map(b2 => mover(2.7,'var(--rock)',false,2.7,b2,false)).join('');
      if (f.infra.on)   out += [0.45,1.8].map(b2 => mover(2.5,'var(--rock)',true,2.7,b2,false)).join('');
      if (f.up.on)      out += [0.2,1.9].map(b2 => mover(2.5,'var(--self)',false,3.4,b2,true)).join('');
    }
    const why = !f.content.on ? `content: ${f.content.why}`
              : !f.infra.on ? `installs: ${f.infra.why}` : null;
    if (why){
      const lx = (x1+x2)/2, ly = (y1+y2)/2 + 4;
      out += `<rect x="${lx - (why.length*2.9 + 8)}" y="${ly-10}" width="${why.length*5.8 + 16}"
        height="14" rx="3" fill="var(--canvas)"/><text x="${lx}" y="${ly}" text-anchor="middle"
        font-family="system-ui,sans-serif" font-size="9" fill="var(--soft)">${esc(why)}</text>`;
    }
    return out;
  }).join('');

  const sevOrder = ['blocked','false','dead','unbuilt'];
  const cards = list.map(n => {
    const mine = vio.filter(v => v.node === n.id);
    const worst = sevOrder.find(s => mine.some(v => v.sev === s));
    const p = pos[n.id] || { x:0, y:0 };
    const rq = inboxOf(n.id).length;
    const nb = layer === 'value' ? netBadge(n) : null;
    const xtra = layer === 'value'
      ? `<span class="xtra">${esc((ledger(n).find(r => r.k === 'seat') || {}).t || '')}</span>${
          nb ? `<span class="netb" data-netb="${n.id}" data-t="${nb.tone}">${esc(nb.t)}</span>` : ''}`
      : layer === 'origin'
      ? `<span class="xtra">${esc((lineage(n)[0] || {}).t || '')}</span>`
      : '';
    return `<button class="bx" data-id="${n.id}" data-sel="${n.id === sel ? 1 : 0}"
      data-me="${actingAs === n.id ? 1 : 0}"
      data-status="${n.status}" data-kind="${n.pebbles ? 'rock' : 'pebble'}"
      title="${actingAs === n.id ? 'you are in this seat' : 'double-click to take this seat'}"
      style="left:${p.x}px; top:${p.y}px">
      ${rq ? `<span class="rq" title="${rq} request${rq>1?'s':''} waiting for this seat">${rq}</span>` : ''}
      ${worst && actingAs === 'CRADS' ? `<span class="dot" data-sev="${worst}" title="worst ${worst}"></span>` : ''}
      <span class="hd"><span class="kind">${n.pebbles ? 'rock' : 'pebble'}</span>${
        REL[n.id] ? `<span class="rel">${REL[n.id]}</span>`
        : actingAs === n.id ? '<span class="rel">you</span>' : ''}</span>
      <span class="bd"><span class="nm">${esc(n.label)}</span>
      <span class="meta">owner <span class="val" data-v="${ownerTone(n)}">${esc(ownerLbl(n))}</span>
        &nbsp;&#183;&nbsp; run <span class="val" data-v="${runTone(n)}">${esc(runnerLbl(n))}</span></span>
      ${xtra}</span>
    </button>`;
  }).join('');

  const hosted = nodes.filter(n => hostedPayerOf(n)).length;
  const crq = inboxOf('CRADS').length;
  const crads = `<button class="bx crads" data-id="CRADS" data-sel="${sel === 'CRADS' ? 1 : 0}"
      data-me="${actingAs === 'CRADS' ? 1 : 0}"
      title="${actingAs === 'CRADS' ? 'you are in the overview seat' : 'double-click for the overview (Crads AI) seat'}"
      data-status="active" data-kind="rock" style="left:0px; top:0px">
      ${crq ? `<span class="rq" title="${crq} waiting for the platform">${crq}</span>` : ''}
      <span class="hd"><span class="kind" style="color:var(--plat);background:#F0EAFC">platform</span>${
        actingAs === 'CRADS' ? '<span class="rel">you</span>' : ''}</span>
      <span class="bd"><span class="nm">Crads AI</span>
      <span class="meta">the operator: machinery + hosting</span>
      ${layer === 'value' ? (() => { const t = fleetTotals();
        return `<span class="xtra">${money(t.crads)}/mo in · runs ${t.machines} machine${
            t.machines === 1 ? '' : 's'} at ${money(PRICE.hostCost)}</span><span
          class="netb" data-t="${t.net >= 0 ? 'pos' : 'neg'}" data-netb="CRADS">net ${
            t.net >= 0 ? '+' : '−'}${money(Math.abs(t.net))}/mo${
            t.crads ? ` · ${Math.round(t.net / t.crads * 100)}%` : ''}</span>`; })() : ''}
      </span></button>`;

  const cv = $('canvas');
  cv.innerHTML = crads + cards;
  const hbox = {};
  cv.querySelectorAll('.bx').forEach(b => { hbox[b.dataset.id] = b.offsetHeight; });
  /* the grow sliders: one per live rock, a sibling strip under the card (the
     card is a <button>, so interactive pebbles cannot live inside it) */
  let strips = '', stripY = 0;
  if (layer === 'value') list.filter(n => n.pebbles && n.status !== 'left').forEach(n => {
    const P = pos[n.id]; if (!P) return;
    const y = P.y + (hbox[n.id] || NH) + 5;
    stripY = Math.max(stripY, y + 30);
    strips += `<div class="simc" style="left:${P.x}px; top:${y}px"
      title="grow this rock: each simulated member is a self-owned brain on a rock-carried hosted seat, paying the anchor fee at list rates">
      <span>grow</span>
      <input type="range" min="0" max="100" step="1" value="${n.sim || 0}" data-simrange="${n.id}">
      <b data-simcount="${n.id}">${n.sim || 0}</b></div>`;
  });
  const realY = Math.max(NH, stripY,
    ...list.map(n => (pos[n.id] ? pos[n.id].y : 0) + (hbox[n.id] || NH)));
  const wires = buildWires(pp => hbox[pp.id] || NH);
  let platWires = '';
  if (layer === 'value'){
    const chH = hbox['CRADS'] || 84;
    list.filter(n => actingAs === 'CRADS' ? true : n.id === sel || n.id === actingAs).forEach(n => {
      const P = pos[n.id]; if (!P) return;
      const kinds = [];
      const hostedPaid = nodes.filter(b => hostedPayerOf(b) === n).length;
      if (hostedPaid) kinds.push(hostedPaid > 1 ? `${hostedPaid} hosted seats` : 'hosted seat');
      if (n.runs === 'self') kinds.push('machinery');
      if (n.status !== 'left' && chOf(n).some(c => c.status !== 'left')) kinds.push('platform');
      if (!kinds.length) return;
      const x1 = P.x + 4, y1 = P.y + (hbox[n.id] || NH)/2, x2 = NW - 2, y2 = chH/2 + 8;
      const lbl = 'pays Crads AI: ' + kinds.join(' + ');
      const w2 = lbl.length * 5.2 + 12;
      const lx = x2 + (x1 - x2) * 0.3, ly = y2 + (y1 - y2) * 0.3 - 4;
      platWires += `<path d="M${x1} ${y1} L${x2} ${y2}" fill="none" stroke="var(--plat)"
          stroke-width="1.1" stroke-dasharray="2 5" opacity=".8"/>
        <rect x="${lx - w2/2}" y="${ly - 9}" width="${w2}" height="14" rx="3" fill="var(--canvas)"/>
        <text x="${lx}" y="${ly + 2}" text-anchor="middle" font-family="system-ui,sans-serif"
          font-size="8.5" fill="var(--plat)">${esc(lbl)}</text>`;
    });
  }
  cv.innerHTML = `<svg class="tree" width="${maxX}" height="${realY}"><defs>
    <marker id="arw-pay" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
      orient="auto"><path d="M0 1 L9 5 L0 9 z" fill="var(--self)"/></marker>
    </defs>${wires}${platWires}</svg>${crads}${cards}${strips}`;
  cv.style.width = maxX + 'px';
  cv.style.height = realY + 'px';
  WORLD = { w: maxX, h: realY };
  $('horizon').textContent = actingAs === 'CRADS'
    ? 'the platform sees every mineral and machine; never a brain, never the fees between rocks and members'
    : (view && view.hidden > 0
      ? `${view.hidden} mineral${view.hidden > 1 ? 'es' : ''} beyond your sight: never siblings, never grandpebbles`
      : 'everything that exists is within your sight');
}

function renderFocus(){
  const n = actingAs === 'CRADS' ? byId(sel) : byId(actingAs);
  const cv = $('canvas');
  if (!n || sel === 'CRADS' && actingAs === 'CRADS' && !byId(sel)){
    cv.style.width = '460px'; cv.style.height = '80px';
    cv.innerHTML = `<p class="empty" style="padding:20px">Pick a mineral to see who reaches it.</p>`;
    WORLD = { w: 460, h: 80 };
    return;
  }
  const W = 700, AX = 4, AW = 172, BX = 486, BW = 206, GAP = 26, ROW = 42;
  const groups = reaches(n);
  let y = 14, rows = '';
  groups.forEach(g => {
    const h = Math.max(56, g.arrows.length * ROW + 14);
    rows += `<rect x="${AX}" y="${y}" width="${AW}" height="${h}" rx="8" fill="var(--panel)"
      stroke="var(--${g.tone})" stroke-width="1"/>
      <text x="${AX+14}" y="${y+24}" font-family="system-ui,sans-serif" font-size="12.5"
        font-weight="650" fill="var(--ink)">${esc(g.name)}</text>
      <text x="${AX+14}" y="${y+40}" font-family="system-ui,sans-serif" font-size="8.6"
        letter-spacing=".05em" fill="var(--faint)">${esc(g.sub.toUpperCase())}</text>`;
    g.arrows.forEach((a, i) => {
      const ay = y + 28 + i*ROW;
      const endX = a.state === 'stopped' ? BX - 44 : BX - 3;
      rows += `<path d="M${AX+AW+6} ${ay} H${endX}" stroke="var(--${g.tone})" stroke-width="1.25"
        fill="none" ${a.state === 'temp' ? 'stroke-dasharray="5 4"' : ''}
        ${a.state === 'stopped' ? 'opacity=".45"' : `marker-end="url(#in-${g.tone})"`}/>`;
      if (a.state === 'stopped')
        rows += `<path d="M${endX} ${ay-9} V${ay+9}" stroke="var(--bad)" stroke-width="2.25"
          stroke-linecap="round"/>`;
      const [vword, vtone] = a.state === 'stopped' ? ['REFUSED','var(--bad)']
        : a.state === 'temp' ? ['TEMPORARY','var(--warn)'] : ['ALLOWED','var(--good)'];
      rows += `<text x="${AX+AW+16}" y="${ay-8}" font-family="system-ui,sans-serif" font-size="10"
        fill="var(--soft)">${esc(a.label)}</text>
        <text x="${BX-10}" y="${ay-8}" text-anchor="end" font-family="system-ui,sans-serif"
          font-size="9" letter-spacing=".08em" font-weight="650" fill="${vtone}">${vword}</text>`;
      if (a.why)
        rows += `<text x="${AX+AW+16}" y="${ay+15}" font-family="system-ui,sans-serif"
          font-size="10.5" fill="var(--faint)">${esc(a.why)}</text>`;
    });
    y += h + GAP;
  });
  const H = Math.max(y, 210), bh = H - 28;
  const markers = ['rock','self','plat'].map(t =>
    `<marker id="in-${t}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
      orient="auto"><path d="M0 1 L9 5 L0 9 z" fill="var(--${t})"/></marker>`).join('');
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  cv.innerHTML = `<svg class="tree" width="${W}" height="${H}" style="position:relative">
    <defs>${markers}</defs>${rows}
    <rect x="${BX}" y="14" width="${BW}" height="${bh}" rx="8" fill="var(--panel)"
      stroke="var(--accent)" stroke-width="1.4"/>
    <text x="${BX+17}" y="${14+27}" font-family="system-ui,sans-serif" font-size="8.5"
      letter-spacing=".14em" fill="var(--faint)">THIS MINERAL</text>
    <text x="${BX+17}" y="${14+52}" font-family="system-ui,sans-serif" font-size="15"
      font-weight="650" fill="var(--ink)">${esc(n.label)}</text>
    <text x="${BX+17}" y="${14+72}" font-family="system-ui,sans-serif" font-size="9"
      fill="var(--faint)">owner ${esc(ownerLbl(n))} / run ${esc(runnerLbl(n))}</text>
  </svg>`;
  WORLD = { w: W, h: H };
  $('horizon').textContent = 'who reaches this mineral, arrow by arrow';
}

/* the Pricing drawer. One UNIVERSAL price list (ruled 2026-07-28): no
   per-contract deals. The platform fee is a SUBSCRIPTION, tiered by the rock's
   member MIX (a home ceiling + a community ceiling per tier). Grouped by WHO
   IS PAID. Every price is a slider + number, dual-bound; tier ceilings are
   editable numbers. */
const RATE_MAX = { brain:300, hosted:200, standalone:500, machinery:150,
  hostCost:100, homeMember:600, commMember:300 };
const TIER_FEE_MAX = [600, 1500, 3000, 6000];
/* ---- who may set what (Sam, 2026-08-03) ----------------------------------
   Rates are not a free-for-all dial. Each figure has an owner in the real
   business, and the sheet now says so instead of letting any seat move any
   number:
     · Crads AI sets what is paid TO Crads AI: seats, its own hosting overhead,
       and the platform subscription tiers.
     · A COMMUNITY sets its own membership retail. If a box is part of one, by
       home or by community membership, that community prices it, not us. So
       these two are editable only from a community's seat, and only ever by
       that community for its own members.
     · The Anthropic per-brain price is nobody's dial here. It is a published
       cost an owner pays, so it is shown and never edited.
   Real mode edits nothing at all: it is a reading of a live network, and the
   sheet beside it is a reference, not a control panel. */
const CRADS_RATES = new Set(['hosted', 'standalone', 'machinery', 'hostCost']);
const COMMUNITY_RATES = new Set(['homeMember', 'commMember']);
const actingIsCommunity = () => { const n = byId(actingAs); return !!(n && n.pebbles); };
function rateEditable(key){
  if (REAL) return false;
  if (COMMUNITY_RATES.has(key)) return actingIsCommunity();
  if (CRADS_RATES.has(key) || key === '__tier') return actingAs === 'CRADS';
  return false;   /* 'brain', and anything added later, until it is placed above */
}
/* The drawer is deliberately NOT re-rendered by render(): that would tear the
   control out from under a drag. But changing seat changes who may edit, so
   redraw on exactly that, and only that. */
let ratesAuth = null;
function syncRatesAuthority(){
  const sig = REAL ? 'real' : actingAs === 'CRADS' ? 'crads' : actingIsCommunity() ? 'community' : 'none';
  if (sig === ratesAuth) return;
  ratesAuth = sig;
  drawRates();
}

function drawRates(){
  const rr = (label, key, hint) => {
    const on = rateEditable(key);
    const d = on ? '' : ' disabled';
    return `<div class="rr${on ? '' : ' ro'}" title="${esc(hint)}">
    <span>${label}</span><input type="number" min="0" step="1" data-rate="${key}" value="${PRICE[key]}"${d}>
    <input type="range" min="0" max="${RATE_MAX[key]}" step="1" data-rate="${key}" value="${PRICE[key]}"${d}></div>`;
  };
  const tier = (t, i) => {
    const last = i === PRICE.tiers.length - 1;
    const d = rateEditable('__tier') ? '' : ' disabled';
    return `<div class="rr${d ? ' ro' : ''}" title="${esc(last
      ? 'the open-ended top tier: everything larger lands here'
      : 'a rock lands in the first tier that covers BOTH its counts')}">

/* ------------------------------------------------------------ pan + zoom --- */
let PX = 20, PY = 20, Z = 1, WORLD = { w: 800, h: 500 };
const vp = $('vp'), world = $('canvas');
function applyView(){ world.style.transform = `translate(${PX}px, ${PY}px) scale(${Z})`; }
function fitView(){
  const r = vp.getBoundingClientRect();
  const pad = 44;
  Z = Math.min(1, Math.max(0.48,
    Math.min((r.width - pad*2) / Math.max(WORLD.w, 1), (r.height - pad*2) / Math.max(WORLD.h, 1))));
  PX = Math.max(pad/2, (r.width - WORLD.w * Z) / 2);
  PY = Math.max(pad/2, (r.height - WORLD.h * Z) / 2.2);
  applyView();
}
function zoomAt(cx, cy, dz){
  const r = vp.getBoundingClientRect();
  const mx = cx - r.left, my = cy - r.top;
  const z2 = Math.min(2.2, Math.max(0.3, Z * dz));
  PX = mx - (mx - PX) * (z2 / Z);
  PY = my - (my - PY) * (z2 / Z);
  Z = z2; applyView();
}
vp.addEventListener('wheel', e => {
  /* panels scroll natively; the canvas owns the wheel everywhere else */
  if (e.target.closest('.legend, .drawer')) return;
  e.preventDefault();
  if (e.ctrlKey || Math.abs(e.deltaY) > Math.abs(e.deltaX)){
    zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * 0.0016));
  } else { PX -= e.deltaX; applyView(); }
}, { passive:false });
$('zoomIn').addEventListener('click', () => {
  const r = vp.getBoundingClientRect(); zoomAt(r.left + r.width/2, r.top + r.height/2, 1.25); });
$('zoomOut').addEventListener('click', () => {
  const r = vp.getBoundingClientRect(); zoomAt(r.left + r.width/2, r.top + r.height/2, 0.8); });
$('zoomFit').addEventListener('click', fitView);
$('zoom100').addEventListener('click', () => { Z = 1; applyView(); });

/* ---------------------------------------------------------------- events --- */
let drag = null, pan = null, suppressClick = false;
vp.addEventListener('pointerdown', e => {
  const b = e.target.closest('.bx');
  if (b && b.dataset.id !== 'CRADS'){
    drag = { id: b.dataset.id, el: b, sx: e.clientX, sy: e.clientY,
      ox: parseFloat(b.style.left) || 0, oy: parseFloat(b.style.top) || 0, moved: false };
    try { b.setPointerCapture(e.pointerId); } catch {}
    return;
  }
  if (!b && !e.target.closest('.drawer, .zoomer, .legend, .hud-bl, .simc')){
    pan = { sx: e.clientX, sy: e.clientY, ox: PX, oy: PY };
    vp.classList.add('panning');
  }
});
/* grow sliders: while dragging, patch the money surfaces in place (a full
   render would swap the slider out from under the pointer); settle on release */
function patchMoney(){
  document.querySelectorAll('[data-netb]').forEach(el => {
    if (el.dataset.netb === 'CRADS'){
      const t = fleetTotals();
      el.dataset.t = t.net >= 0 ? 'pos' : 'neg';
      el.textContent = `net ${t.net >= 0 ? '+' : '−'}${money(Math.abs(t.net))}/mo${
        t.crads ? ` · ${Math.round(t.net / t.crads * 100)}%` : ''}`;
      return;
    }
    const n = byId(el.dataset.netb); if (!n) return;
    const b = netBadge(n);
    if (b){ el.dataset.t = b.tone; el.textContent = b.t; }
  });
  drawChrome(validate());
  drawInspector();
}
vp.addEventListener('input', e => {
  const r = e.target.closest('[data-simrange]'); if (!r) return;
  const n = byId(r.dataset.simrange); if (!n) return;
  n.sim = Math.max(0, Math.round(+r.value) || 0);
  const c = vp.querySelector(`[data-simcount="${n.id}"]`);
  if (c) c.textContent = n.sim;
  patchMoney();
});
vp.addEventListener('change', e => {
  if (e.target.closest('[data-simrange]')) render();
});
vp.addEventListener('pointermove', e => {
  if (drag){
    const dx = (e.clientX - drag.sx) / Z, dy = (e.clientY - drag.sy) / Z;
    if (!drag.moved && Math.hypot(dx, dy) < 5) return;
    drag.moved = true;
    drag.el.style.left = Math.max(0, drag.ox + dx) + 'px';
    drag.el.style.top = Math.max(0, drag.oy + dy) + 'px';
    return;
  }
  if (pan){ PX = pan.ox + (e.clientX - pan.sx); PY = pan.oy + (e.clientY - pan.sy); applyView(); }
});
vp.addEventListener('pointerup', () => {
  if (drag){
    if (drag.moved){
      const n = byId(drag.id);
      if (n){ n.fx = Math.max(0, parseFloat(drag.el.style.left) || 0);
              n.fy = Math.max(0, parseFloat(drag.el.style.top) || 0); }
      suppressClick = true;
      setTimeout(() => { suppressClick = false; }, 0);
      render();
    }
    drag = null;
  }
  pan = null; vp.classList.remove('panning');
});
/* single click selects; a second click on the same box within 350ms TAKES its
   seat. We detect this by hand rather than with the native dblclick event,
   because the first click re-renders the canvas and swaps out the element, so
   the browser never sees two clicks on one node. */
let lastClickId = null, lastClickT = 0;
vp.addEventListener('click', e => {
  if (suppressClick){ suppressClick = false; return; }
  const b = e.target.closest('.bx'); if (!b) return;
  const id = b.dataset.id, now = performance.now();
  if (id === lastClickId && now - lastClickT < 350){
    lastClickId = null; lastClickT = 0;
    actingAs = id; sel = id; render(); fitView();
    return;
  }
  lastClickId = id; lastClickT = now;
  sel = id; render();
});

let menuEl = null;

  closeMenu();

  menuEl.innerHTML = items.map(it => it.sep ? '<div class="msep"></div>'
    : it.head ? `<div class="mhead">${esc(it.head)}</div>`
    : `<button class="mi" data-mid="${esc(it.id)}" ${it.disabled ? `disabled title="${esc(it.reason || '')}"` : ''}

        it.note ? `<span class="note">${esc(it.note)}</span>` : ''}</button>`).join('');
  document.body.appendChild(menuEl);
  const r = anchor.getBoundingClientRect();
  let x = Math.min(r.left, innerWidth - menuEl.offsetWidth - 8);
  let y = r.bottom + 6;
  if (y + menuEl.offsetHeight > innerHeight - 8) y = r.top - menuEl.offsetHeight - 6;
  menuEl.style.left = x + 'px'; menuEl.style.top = Math.max(8, y) + 'px';

function destroyBox(id){
  const n = byId(id); if (!n) return;
  pushHistory();
  const d = [];
  nodes.filter(c => (c.rocks || []).includes(n.id)).forEach(c => {
    c.rocks = c.rocks.filter(x => x !== n.id);
    if (c.home === n.id){ c.home = null;
      d.push(`${c.label}: manager gone, its seat falls onto its own bill`); }
    if (c.owner === n.id){ c.owner = 'self';
      d.push(`${c.label}: its owner is gone; it owns itself now (flagged for review)`); }
    if (!d.some(x => x.startsWith(c.label))) d.push(`${c.label}: community tie ended`);
  });
  nodes = nodes.filter(x => x.id !== n.id);
  requests = requests.filter(r => r.subject !== n.id && r.from !== n.id && r.to !== n.id);
  if (actingAs === n.id) actingAs = 'CRADS';
  sel = actingAs === 'CRADS' ? 'CRADS' : actingAs;
  lastChange = { id: sel, action: `destroyed ${n.label}`,
    d: d.length ? d : ['nothing was attached to it'] };

        : [{ id:'__none2', label:'No connected rock', note:'join a rock first', go(){} }]);
    }
    if (which === 'runs'){
      openMenu(dial, [
        { id:'crads', label:'Crads AI hosts', note:'the default: a hosted seat', pressed: n.runs === 'crads-ai',
          disabled: n.runs === 'crads-ai', go: () => runVerb(n, 'runs', 'crads-ai') },
        { id:'self', label:'Own metal', note:'by approved request to the platform', pressed: n.runs === 'self',
          disabled: n.runs === 'self' || !!guard(n, 'runs', 'self'), reason: guard(n, 'runs', 'self') || '',
          go: () => sendReq('ownMetal', actingAs, 'CRADS', n.id, null,
            `${n.label} requests its own metal`) },
        { id:'owner', label:'Owner\u2019s metal', note:'enterprise-only: the owning rock operates it',
          pressed: n.runs === 'owner',
          disabled: n.runs === 'owner' || !!guard(n, 'runs', 'owner'), reason: guard(n, 'runs', 'owner') || '',
          go: () => runVerb(n, 'runs', 'owner') }
      ]);
    }
    return;
  }
  const vm = e.target.closest('[data-menu]');
  if (vm && !vm.disabled && actingAs !== 'CRADS'){
    const tgt = byId(vm.dataset.target || actingAs); if (!tgt) return;
    const onBehalf = tgt.id !== actingAs;
    if (vm.dataset.menu === 'joinSeat'){
      openMenu(vm, nodes.filter(x => canJoin(tgt, x))
        .map(x => ({ id: x.id, label: x.label, note: 'apply: the rock answers from its seat',
          go: () => sendReq('apply', actingAs, x.id, tgt.id, x.id,
            `${tgt.label} applies to join ${x.label}`) })));
    }
    if (vm.dataset.menu === 'leaveSeat'){
      openMenu(vm, rocksAll(tgt).map(p => ({ id: p.id, label: `Leave ${p.label}`,
        note: homeOf(tgt) === p ? 'its manager: the tie ends, the bill moves' : 'community tie ends',
        go: () => { pushHistory();
          const before = moneySnap(tgt);
          const notes = onBehalf ? [`${tgt.label} left ${p.label} (your call as owner)`] : [];
          tgt.rocks = (tgt.rocks || []).filter(id => id !== p.id);
          if (tgt.home === p.id){ tgt.home = null; notes.push('that was its manager: the tie ends with the edge'); }
          if (tgt.owner === p.id){ tgt.owner = 'self';
            notes.push('you left as an OWNED box: ownership falls back to the member (an owner needs an edge)'); }
          announce(tgt, `left ${p.label}`, before, notes);
          sel = tgt.id; render(); } })));
    }
    return;
  }
  const sv = e.target.closest('[data-seat-verb]');
  if (sv && !sv.disabled){
    const tgt = byId(sv.dataset.target); if (!tgt) return;
    const v0 = sv.dataset.val;
    runVerb(tgt, sv.dataset.seatVerb, v0 === 'true' ? true : v0 === 'false' ? false : v0);
    return;
  }
  const sd = e.target.closest('[data-seat-destroy]');
  if (sd){ destroyBox(sd.dataset.seatDestroy); return; }
});

});

/* cmd-k */
let ckHot = 0;
function openCK(){
  $('ckwrap').dataset.open = '1';
  $('ckInput').value = ''; ckHot = 0; fillCK('');
  $('ckInput').focus();
}
function closeCK(){ $('ckwrap').dataset.open = '0'; }
function fillCK(q){
  const ql = q.toLowerCase();
  const hits = nodes.filter(n => n.label.toLowerCase().includes(ql)).slice(0, 12);
  ckHot = Math.min(ckHot, Math.max(0, hits.length - 1));
  $('ckList').innerHTML = hits.map((n, i) =>
    `<button class="mi" data-ck="${n.id}" data-hot="${i === ckHot ? 1 : 0}">
      <span>${esc(n.label)}</span>
      <span class="k2">${n.pebbles ? 'rock' : 'pebble'} \u00b7 owner ${esc(ownerLbl(n))}</span></button>`).join('')
    || '<p class="empty" style="padding:10px 12px">No mineral by that name.</p>';
}
function pickCK(id){
  closeCK(); sel = id; render();
  const r = vp.getBoundingClientRect();
  const el = world.querySelector(`.bx[data-id="${id}"]`);
  if (el){
    const bx = parseFloat(el.style.left) || 0, by = parseFloat(el.style.top) || 0;
    PX = r.width/2 - (bx + NW/2) * Z;
    PY = r.height/2.4 - by * Z;
    applyView();
  }
}
$('ckBtn').addEventListener('click', openCK);
$('ckInput').addEventListener('input', e => { ckHot = 0; fillCK(e.target.value); });
$('ckInput').addEventListener('keydown', e => {
  const hits = [...$('ckList').querySelectorAll('[data-ck]')];
  if (e.key === 'ArrowDown'){ e.preventDefault(); ckHot = Math.min(ckHot+1, hits.length-1); fillCK(e.target.value); }
  if (e.key === 'ArrowUp'){ e.preventDefault(); ckHot = Math.max(ckHot-1, 0); fillCK(e.target.value); }
  if (e.key === 'Enter' && hits[ckHot]) pickCK(hits[ckHot].dataset.ck);
  if (e.key === 'Escape') closeCK();
});
$('ckList').addEventListener('click', e => {
  const b = e.target.closest('[data-ck]'); if (b) pickCK(b.dataset.ck);
});
$('ckwrap').addEventListener('click', e => { if (e.target === $('ckwrap')) closeCK(); });

/* keyboard */
document.addEventListener('keydown', e => {
  const tag = (document.activeElement || {}).tagName || '';
  const typing = /INPUT|SELECT|TEXTAREA/.test(tag);
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k'){
    e.preventDefault(); openCK(); return; }
  if (typing) return;
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z'){
    e.preventDefault(); if (e.shiftKey) doRedo(); else doUndo(); return; }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'y'){
    e.preventDefault(); doRedo(); return; }
  if (e.key === 'Escape'){
    if (menuEl){ closeMenu(); return; }
    if ($('iowrap').dataset.open === '1'){ closeIO(); return; }
    if ($('ckwrap').dataset.open === '1'){ closeCK(); return; }
    if ($('ratesDrawer').dataset.open === '1'){ openRates(false); return; }
    if ($('drawer').dataset.open === '1'){ $('drawer').dataset.open = '0'; return; }
  }
});

/* ------------------------------------------------------------ rates wiring ---
   The Pricing drawer edits PRICE in place; the drawer body itself is never
   re-rendered by render(), so a drag or keystroke keeps its control. Rates are
   settings, not sheet state: no undo, persisted locally. */
$('ratesBody').addEventListener('input', e => {
  const t = e.target;
  const v = Math.max(0, Math.round(+t.value) || 0);
  let twin = null;
  /* Authority is enforced HERE as well as by the disabled attribute. Disabled
     is the affordance; this is the rule. They can drift apart for one frame
     after a seat change, and a disabled attribute is a suggestion to anyone
     with a devtools console. */
  if (t.dataset.tier !== undefined){
    if (!rateEditable('__tier')) return;
    PRICE.tiers[+t.dataset.tier][t.dataset.tf] = v;
    if (t.dataset.tf === 'fee') twin = `[data-tier="${t.dataset.tier}"][data-tf="fee"]`;
  } else if (t.dataset.rate){
    if (!rateEditable(t.dataset.rate)) return;
    PRICE[t.dataset.rate] = v;
    twin = `[data-rate="${t.dataset.rate}"]`;
  } else return;
  /* dual-bound price controls: dragging the slider moves the number, and back */
  if (twin) $('ratesBody').querySelectorAll(twin).forEach(x => { if (x !== t) x.value = v; });
  saveRates();
  render();
});
/* Reset restores only the figures THIS seat sets, so a community cannot
   reset the platform's prices by pressing a button labelled Reset, and
   vice versa. */
$('rateReset').addEventListener('click', () => {

  if (REAL || !keys.length) return;
  keys.forEach(k => { PRICE[k] = PRICE_DEFAULTS[k]; });
  if (actingAs === 'CRADS') PRICE.tiers = cloneRates(PRICE_DEFAULTS).tiers;
  saveRates(); drawRates(); render();
});
const openRates = (on) => {
  $('ratesDrawer').dataset.open = on ? '1' : '0';

};
$('ratesBtn').addEventListener('click', () =>
