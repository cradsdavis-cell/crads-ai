# ============================================================================
# AI OS — Per-Client Profile Schema   (schema_version 0.1)
# ============================================================================
# THE personalisation contract. Everything that makes an instance "this
# person's assistant" lives here. The engine (shared, versioned) reads this;
# nothing about a specific human is hard-coded in the engine.
#
# One per client, mounted at /state/profile.yaml. Generated by the /onboard
# interview, then hand-tuned. This file is the schema/template (commented);
# config/profile.example.maya.yaml is a filled instance.
# ============================================================================

schema_version: 0.1

# --- Identity ---------------------------------------------------------------
identity:
  user_name: ""          # the human this OS serves, e.g. "Maya Chen"
  user_short: ""         # what the assistant calls them, e.g. "Maya"
  assistant_name: ""     # the assistant's name (Sam's is "Idris")
  timezone: "Australia/Sydney"   # IANA tz. Drives ALL scheduling. box-up.sh copies this
                         # file verbatim as a new box's profile.yaml and NOTHING else ever
                         # writes this key, so whatever ships here IS the default every box
                         # runs on. It shipped "" until 2026-08-14, which the scheduler read
                         # as UTC: every box scheduled 10 hours off local time. Onboarding
                         # overwrites it per member; the default must stay a real zone.
  locale: "en-AU"        # spelling + date format
  location: ""           # city, for local context/phrasing
  voice_note: ""         # 1-2 lines on how the assistant should sound to them

# --- Business context -------------------------------------------------------
# Powers the SMB re-theme + onboarding. Tells the assistant what "a customer",
# "a job", "a follow-up" MEAN for this person.
business:
  type: ""               # e.g. "wedding photographer", "plumber", "fitness studio"
  one_liner: ""          # what they do, in their words
  customers: ""          # who they serve
  offerings: []          # list of { name, price } — products/services
  busy_seasons: []       # optional seasonal patterns to be aware of
  quarter_goal: ""       # what success looks like this quarter (seeds priorities)

# --- Accounts / integrations ------------------------------------------------
# PROVIDER-AGNOSTIC (decisions D12): calendar + email name provider google|microsoft.
# Skills stay provider-neutral; the connect-mechanism wires the matching MCP (Google
# Workspace vs Microsoft Graph). Inbound triage via the forwarding mailbox works for
# BOTH (Gmail or Outlook). Scope strategy = D3 (Google) + D12 (Microsoft).
accounts:
  calendar:
    enabled: true
    provider: "google"   # google | microsoft
    calendar_id: ""      # client's primary calendar address
  email:                 # send-on-behalf (was gmail_send; provider-neutral)
    enabled: true
    provider: "google"   # google (gmail.send, sensitive) | microsoft (Graph Mail.Send)
    send_as: ""          # client's address
  inbox_triage:
    enabled: true
    mode: "forwarding"   # google → "forwarding" (sidesteps Google's restricted-read CASA); microsoft → "api" (direct Graph Mail.Read, no CASA)
    forwarding_mailbox: ""  # operator-owned address the client auto-forwards to (Gmail OR Outlook)
  tasks:
    enabled: false
    provider: "none"     # todoist | google_tasks | microsoft_todo | none
  messaging:
    whatsapp: false
    slack: false

# --- Communication / control ------------------------------------------------
comms:
  primary_channel: "telegram"
  telegram:
    bot_token_ref: ""    # SECRET REF into /state/secrets — never the token itself
    chat_id_ref: ""
  outbound_policy: "propose-confirm"   # DEFAULT + compliance requirement (D4).
                                       # Nothing sends without explicit approval.
                                       # Changing to "auto" requires a written allowlist.
  ai_disclosure: true    # disclose AI authorship where a human would assume human (D4)

# --- What the assistant thinks with ------------------------------------------
# harness = the agent program that runs a turn. model = where the thinking happens.
# Absent block (every mineral born before 2026-09-17) means claude-code + your Claude
# sign-in, exactly as before. Read by engine/kernel/lib/harness/index.mjs, which REFUSES
# an unknown harness or a pairing the harness does not declare; it never falls back
# silently. Spec: docs/superpowers/specs/2026-09-17-second-harness-design.md.
# (Replaces the old `models:` tiering block, which nothing ever read.)
assistant:
  harness: claude-code           # any id in engine/kernel/lib/harness/registry.json
  model:
    source: signin               # signin | endpoint
    provider: anthropic          # claude-code: anthropic. opencode: openai | github-copilot | ollama | openai-compatible
    id: ""                       # empty = the harness default; REQUIRED for an endpoint
    base_url: ""                 # endpoint only, e.g. http://127.0.0.1:11434/v1
    key_ref: ""                  # endpoint only: SECRET REF (a file name in /state/secrets), never the key
    timeout_s: 240               # per turn; raise it for slow hardware

# --- Cadence (all times in identity.timezone) -------------------------------
cadence:
  enabled: false                   # OFF by default. true → the box runs scheduled jobs (morning
                                   # brief / inbox watch / weekly) autonomously. They spend YOUR
                                   # Claude tokens and DRAFT only — never auto-send.
  morning_brief: "07:00"
  evening_review: "18:00"
  inbox_watcher_interval_min: 30
  weekly_review: "Sun 17:00"
  quiet_hours: "21:00-06:30"       # no proactive pings in this window

# --- Priorities -------------------------------------------------------------
priorities:
  source: "wiki/priorities.md"     # path within client state; assistant ties top-3 to this

# --- People & event classification -----------------------------------------
# Generalises the hard-coded classifier table from Sam's /daily skill.
# Each entry: how to recognise it (names / domains / keywords), what it IS,
# and the one-line action the assistant should suggest.
classifications:
  - match: []            # name patterns, email domains, or subject keywords
    category: ""         # e.g. "enquiry", "booked_client", "supplier", "personal"
    badge: ""            # emoji/short label for the brief
    action: ""           # one-line suggested next step
    route: ""            # optional: where this category's captured material is filed (brain path / surface)

# --- Inbox triage (used by /inbox + /followup) ------------------------------
# Mail arrives via the forwarding mailbox (accounts.inbox_triage), per D3.
inbox:
  cap: 100               # max unread processed per /inbox run; backlog beyond surfaces a footer
  buckets:               # triage scheme; first match wins. Defaults shown — override per client.
    - { id: open-loop, write: none,             rule: "reply-worthy classification, task/decision overlap, or a direct ask" }
    - { id: mark-read, write: "-UNREAD",        rule: "informational classification, no ask; or already replied" }
    - { id: archive,   write: "-UNREAD -INBOX", rule: "List-Unsubscribe + unknown sender; marketing / auto-reply patterns" }
    - { id: hold,      write: none,             rule: "no rule matched / conflicting signals — surface for the client" }

# --- Capture sweep (used by /capture) ---------------------------------------
capture:
  brain_path: "wiki"     # root of the client's brain within state; pages, logs + sweep-state live here
  sources:               # input sources swept each run besides the live conversation. Empty = conversation only.
    - { name: "", provider: "", captures: "", route: "" }   # e.g. a meeting/transcript tool, a chat workspace
  task_filter: {}        # optional per-client overrides to the task proposal/drop filter (see engine/skills/capture.md)

# --- Skills enabled ---------------------------------------------------------
skills:
  enabled:               # from the generic library (engine/skills/)
    - daily
    - inbox
    - followup
    - capture
    - weekly
  bespoke: []            # client-specific skills generated at /onboard

# --- Compliance -------------------------------------------------------------
compliance:
  high_risk_domains: []          # legal/health/finance/employment → force human review (D4)
  data_processing_agreement: false   # set true once signed (required before client ~3-5, D8)
